# Hidden companion mod that installs the game content (as OpenSYW's syw-content): OpenPW starts it when the converted
# Primitive Wars files are missing from the support folder (mods/pw/mod.yaml, ContentInstallerFileSystem). Its screen
# is PwContentLogic (OpenRA.Mods.Pw).
Metadata:
	Title: mod-title
	Version: {DEV_VERSION}
	Hidden: true

FileSystem: DefaultFileSystem
	Packages:
		^EngineDir
		^EngineDir|mods/common-content: content
		^EngineDir|mods/common: common
		$pw-content: pwcontent

Rules:

Cursors:
	content|cursors.yaml

Chrome:
	content|chrome.yaml

Assemblies: OpenRA.Mods.Common.dll, OpenRA.Mods.Pw.dll

ChromeLayout:
	pwcontent|content.yaml

Notifications:
	content|notifications.yaml

LoadScreen: ModContentLoadScreen
	Image: ^EngineDir|mods/common-content/chrome.png
	Image2x: ^EngineDir|mods/common-content/chrome-2x.png
	Image3x: ^EngineDir|mods/common-content/chrome-3x.png

ChromeMetrics:
	common|metrics.yaml
	content|metrics.yaml

FluentMessages:
	common|fluent/common.ftl
	content|fluent/content.ftl
	content|fluent/chrome.ftl
	pwcontent|fluent/content.ftl

Fonts:
	Tiny:
		Font: common|FreeSans.ttf
		Size: 10
		Ascender: 8
	TinyBold:
		Font: common|FreeSansBold.ttf
		Size: 10
		Ascender: 8
	Regular:
		Font: common|FreeSans.ttf
		Size: 14
		Ascender: 11
	Bold:
		Font: common|FreeSansBold.ttf
		Size: 14
		Ascender: 11
	MediumBold:
		Font: common|FreeSansBold.ttf
		Size: 18
		Ascender: 14
	BigBold:
		Font: common|FreeSansBold.ttf
		Size: 24
		Ascender: 18

SoundFormats:

SpriteFormats: PngSheet

TerrainFormat: DefaultTerrain

SpriteSequenceFormat: DefaultSpriteSequence
