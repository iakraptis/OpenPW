# Weapon templates (plan.md §3.3). Concrete weapons set damage (the unit's attack), range, reload and projectile
# speed only. Original values convert as: pixels x 32 = WDist (32 px = 1c0), ticks = ticks.
# Projectile speeds match the original: an arrow of 18 px a tick flies 576 WDist (about 8 cells a second).
# Damage is the original rule, attack minus armour and at least 1 (SubtractArmorDamage, docs/game/rules.md).

# Missiles follow the original's modes (PwBullet, docs/formats/effect.md): mode 2 tracks its unit and hands the damage straight
# to it (nobody beside it is hurt; with splash, the damage spreads around it); mode 4 pierces enemies along its path;
# mode 0 flies to a fixed point. Melee hits strike the target itself. Splash weapons set Range and Falloff, damage
# falling linearly from the impact point to the original splash radius; the Spread below only serves the rest.
^PwWeapon:
	ValidTargets: Ground
	TargetActorCenter: true
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground
		DamageTypes: DefaultDeath
		Spread: 100

# Instant hits at touching range: 1.5 cells, so the 8 cells around a target reach it, the diagonals (1.41 cells)
# included, but not 2 cells away (Mod change: the original reaches by rectangles, .chr 0x370; at 1c256 only the 4 side
# cells reached, so no more than 4 units could fight one).
^Melee:
	Inherits: ^PwWeapon
	Range: 1c512
	Projectile: InstantHit
	# The blow lands on the target itself: no graze for whoever stands beside it.
	Warhead@1Dam: SubtractArmorDamage
		Spread: 16

# Arrows and bolts: a straight missile; can hit flying units (target mask bit 3).
^Arrow:
	Inherits: ^PwWeapon
	ValidTargets: Ground, Air
	Projectile: PwBullet
		Mode: 2
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground, Air

# Poison: the poison weapons of the original (JW2_12 "Poison arrows", "poison-arrow") stun the unit hit for a
# moment, as poison does in the original: ^Unit's "stunned", no moving, no attacking. Added with Inherits@poison.
^Poison:
	Warhead@Stun: GrantExternalCondition
		Condition: stunned
		Duration: 10
		Range: 0c256
		ValidTargets: Ground, Air

# Bombs, stones and eggs: lobbed, ground only, usually with splash.
^Thrown:
	Inherits: ^PwWeapon
	Projectile: PwBullet
		LaunchAngle: 64
		Mode: 2
