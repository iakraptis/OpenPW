# Weapon templates (plan.md §3.3). Concrete weapons set damage (the unit's attack), range, reload and projectile
# speed only. Original values convert as: pixels x 32 = WDist (32 px = 1c0), ticks = ticks.
# Projectile speeds match the original: an arrow of 18 px a tick flies 576 WDist (about 8 cells a second).
# Damage is the original rule, attack minus armour and at least 1 (SubtractArmorDamage, docs/game/rules.md).

# Hits strike the target actor itself (TargetActorCenter). A projectile flies to where the target was and damages what
# it lands near, as OpenSYW's arrows do: full damage within 100 (a tenth of a cell) of a unit's body, then 37%, 14%
# and 5% each 100 further (the engine's SpreadDamage falloff), so a target that moved on a little is still hit. Splash
# weapons set Range and Falloff to reduce damage linearly from the impact point to the original splash radius.
^PwWeapon:
	ValidTargets: Ground
	TargetActorCenter: true
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground
		DamageTypes: DefaultDeath
		Spread: 100

# Instant hits at touching range (the original's 32 px).
^Melee:
	Inherits: ^PwWeapon
	Range: 1c256
	Projectile: InstantHit
	# The blow lands on the target itself: no graze for whoever stands beside it.
	Warhead@1Dam: SubtractArmorDamage
		Spread: 16

# Arrows and bolts: a straight missile; can hit flying units (target mask bit 3).
^Arrow:
	Inherits: ^PwWeapon
	ValidTargets: Ground, Air
	Projectile: PwBullet
		Mode: 2
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground, Air

# Poison: the poison weapons of the original (JW2_12 "Poison arrows", "poison-arrow") stun the unit hit for a
# moment, as poison does in the original: ^Unit's "stunned", no moving, no attacking. Added with Inherits@poison.
^Poison:
	Warhead@Stun: GrantExternalCondition
		Condition: stunned
		Duration: 10
		Range: 0c256
		ValidTargets: Ground, Air

# Bombs, stones and eggs: lobbed, ground only, usually with splash.
^Thrown:
	Inherits: ^PwWeapon
	Projectile: PwBullet
		LaunchAngle: 64
		Mode: 2
