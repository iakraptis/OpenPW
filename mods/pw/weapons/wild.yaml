# The wild creatures' weapons: edited by hand, this file is their source (first written by
# research/tools/wild_rules.py, not to be run again over it). ReloadDelay is the attack animation plus the attack delay
# (.chr 0x13cc), as for the races.

TyranosaurusBite:
	Inherits: ^Melee
	ReloadDelay: 72
	Warhead@1Dam: SubtractArmorDamage
		Damage: 100
	Report: weapon-tyranos-hit-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		ImpactSounds: weapon-tyranos-hit-1.wav

