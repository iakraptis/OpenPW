# Demon weapons (docs/game/demon.md, docs/formats/effect.md). ReloadDelay is the attack animation plus the attack
# delay (.chr 0x13dc sequence length + 0x13cc, D); projectile speeds are the weapon's 0x194 x 32
# (weapons/defaults.yaml). Weapons with no flight frames strike at once (InstantHit) and show their impact art.

InsectHit:
	Inherits: ^Melee
	ReloadDelay: 26
	Warhead@1Dam: SubtractArmorDamage
		Damage: 10

SkeletonArrow:
	Inherits: ^Arrow
	ReloadDelay: 32
	Range: 5c0
	Projectile: PwBullet
		Image: weapon-skeleton-arrows
		Sequences: flight
		Speed: 576
	Warhead@1Dam: SubtractArmorDamage
		Damage: 22
	Report: weapon-skeleton-arrows-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-skeleton-arrows
		Explosions: impact

MudManHit:
	Inherits: ^Melee
	ReloadDelay: 37
	Warhead@1Dam: SubtractArmorDamage
		Damage: 70
	Report: weapon-mudman-hit-0.wav

# Gargoyle: its red eye strikes at once with a red bolt of lightning, at ground or air, splashing 60 px, with a small
# blast where it hits. The original's shot is instant (speed 0, no flight frames) and its bolt is drawn in code, not
# found; the bolt here is the mod's (PwLightningBolt).
RedEye:
	Inherits: ^Arrow
	ReloadDelay: 44
	Range: 10c0
	Projectile: PwLightningBolt
	Warhead@1Dam: SubtractArmorDamage
		Damage: 50
		# Splash: full damage within the original radius (1c896).
		Range: 0, 1c896, 1984
		Falloff: 100, 100, 0
	Report: weapon-red-eye-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-red-eye
		Explosions: impact

# Kelpa: breathes fire at what stands right before it, splashing 48 px around it. The original's 160 px range is not
# used: the record is not a projectile (0x14c = 0), so Pw.exe tests the target against the Kelpa's attack rectangle
# (.chr 0x370-0x37c, doubled: 44 px behind to 58 px ahead; FUN_00457ac3), a reach of about 64 px (2c0) as the
# Soldier's rectangle gives the melee 1c256. The fire then lands where the target stood (FUN_0047ac00).
CelberosFire:
	Inherits: ^PwWeapon
	ReloadDelay: 40
	Range: 2c0
	Projectile: InstantHit
	Warhead@1Dam: SubtractArmorDamage
		Damage: 40
		# The original damage falls to zero at the 48 px splash radius (FUN_00457d4b).
		Range: 0, 1c512
		Falloff: 100, 0
	Report: weapon-celberos-fire-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground
		Image: weapon-celberos-fire
		Explosions: impact

# KingDemon: a line of fire that sweeps forward to its full range and burns the ground units in its path (mode 4,
# target mask 23). The moving front leaves a flame every tick that flares up and dies down in 16 ticks (Pw.exe
# 0x477252); only the front does damage.
KingDemonFire:
	Inherits: ^PwWeapon
	ReloadDelay: 47
	Range: 6c0
	Projectile: PwBullet
		Image: weapon-kingdemon-fire
		Sequences: flight
		Speed: 576
		Mode: 4
		TrailImage: weapon-kingdemon-fire
		TrailSequences: trail
		TrailInterval: 0
		TrailDelay: 0
	Warhead@1Dam: SubtractArmorDamage
		Damage: 60
	Report: weapon-kingdemon-fire-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground
		ImpactSounds: weapon-kingdemon-fire-1.wav

# Darkbat: a sound wave at ground or air.
NoiseWave:
	Inherits: ^Arrow
	ReloadDelay: 44
	Range: 6c0
	Projectile: PwBullet
		Image: weapon-noise-wave
		Sequences: flight
		Speed: 640
	Warhead@1Dam: SubtractArmorDamage
		Damage: 26
	Report: weapon-noise-wave-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-noise-wave
		Explosions: impact
		ImpactSounds: weapon-noise-wave-1.wav

# Devil: the apocalypse strikes its target at once, ground or air.
Apocalypse:
	Inherits: ^Arrow
	ReloadDelay: 41
	Range: 7c0
	Projectile: InstantHit
	Warhead@1Dam: SubtractArmorDamage
		Damage: 150
	Report: weapon-apocalypse-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-apocalypse
		Explosions: impact

# The zombies Rise death raises.
ZombieHit:
	Inherits: ^Melee
	ReloadDelay: 29
	Warhead@1Dam: SubtractArmorDamage
		Damage: 30

# Volcano: the Demon tower's lava shot at ground or air (20 px per tick).
VolcanoShot:
	Inherits: ^Thrown
	ValidTargets: Ground, Air
	ReloadDelay: 24
	Range: 9c0
	Projectile: PwBullet
		Image: weapon-volcano
		Sequences: flight
		Speed: 640
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground, Air
		Damage: 40
	Report: weapon-volcano-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-volcano
		Explosions: impact
