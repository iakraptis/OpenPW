# Dragon: fire on the ground below, splashing 64 px.
DragonFire:
	Inherits: ^PwWeapon
	ReloadDelay: 54
	Range: 10c0
	Projectile: PwBullet
		Image: weapon-dragonfire
		Sequences: flight
		Speed: 576
		Mode: 0
	Warhead@1Dam: SubtractArmorDamage
		Damage: 70
		# The original damage falls to zero at the 64 px splash radius.
		Range: 0, 2c0
		Falloff: 100, 0
	Report: weapon-dragonfire-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground
		Image: weapon-dragonfire
		Explosions: impact

# Phoenix: fire at flyers only (target mask 8; its range against air, 224 px, .chr 0x1b4).
PhoenixFire:
	Inherits: ^PwWeapon
	ValidTargets: Air
	ReloadDelay: 41
	Range: 7c0
	Projectile: PwBullet
		Image: weapon-phonixfire
		Sequences: flight
		Speed: 480
		Mode: 4
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Air
		Damage: 30
	Report: weapon-phonixfire-0.wav

