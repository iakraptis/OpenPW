# Dragon: fire on the ground below, splashing 64 px.
DragonFire:
	Inherits: ^PwWeapon
	ReloadDelay: 54
	Range: 10c0
	Projectile: Bullet
		Image: weapon-dragonfire
		Sequences: flight
		Speed: 1728
	Warhead@1Dam: SubtractArmorDamage
		Damage: 70
		# Splash: full damage within the original radius (2c0).
		Range: 0, 2c0, 2112
		Falloff: 100, 100, 0
	Report: weapon-dragonfire-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground
		Image: weapon-dragonfire
		Explosions: impact

# Phoenix: fire at flyers only (target mask 8; its range against air, 224 px, .chr 0x1b4).
PhoenixFire:
	Inherits: ^PwWeapon
	ValidTargets: Air
	ReloadDelay: 41
	Range: 7c0
	Projectile: Bullet
		Image: weapon-phonixfire
		Sequences: flight
		Speed: 1440
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Air
		Damage: 30
	Report: weapon-phonixfire-0.wav

