# Elf weapons (docs/game/elf.md, docs/formats/effect.md). ReloadDelay is the attack animation plus the attack delay
# (.chr 0x13dc sequence length + 0x13cc, D); projectile speeds are the weapon's 0x194 x 32 x 2
# (weapons/defaults.yaml).

# The Wizard (the worker) shoots a little firebolt.
WizardFirebolt:
	Inherits: ^Arrow
	ReloadDelay: 34
	Range: 4c0
	Projectile: Bullet
		Image: weapon-wizard-firebolt
		Sequences: flight
		Speed: 1056
	Warhead@1Dam: SubtractArmorDamage
		Damage: 9
	Report: weapon-wizard-firebolt-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-wizard-firebolt
		Explosions: impact

