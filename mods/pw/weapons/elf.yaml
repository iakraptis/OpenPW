# Bubble: the Elf tower immobilizes a target for the 36 impact frames x 2 original ticks per frame.
BubbleShot:
	Inherits: ^Arrow
	ReloadDelay: 26
	Range: 9c0
	Projectile: Bullet
		Image: weapon-bubble
		Sequences: flight
		Speed: 1920
	Warhead@1Dam: GrantExternalCondition
		Condition: bubbled
		Duration: 72
		Range: 0c256
		ValidTargets: Ground, Air
	Warhead@2Dam: SubtractArmorDamage
		Damage: 1
	Report: weapon-bubble-0.wav
