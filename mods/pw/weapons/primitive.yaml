# Primitive weapons (docs/game/primitive.md, docs/formats/effect.md). ReloadDelay is the attack animation plus the
# attack delay (.chr 0x13dc sequence length + 0x13cc, D).

BuildManHit:
	Inherits: ^Melee
	ReloadDelay: 58
	Warhead@1Dam: SubtractArmorDamage
		Damage: 10
	Report: weapon-buildman-hit-0.wav

PowerManHit:
	Inherits: ^Melee
	ReloadDelay: 60
	Warhead@1Dam: SubtractArmorDamage
		Damage: 25
	Report: weapon-powerman-hit-0.wav

PowerManShieldHit:
	Inherits: PowerManHit
	ReloadDelay: 56

ThrowBomb:
	Inherits: ^Thrown
	ReloadDelay: 78
	Range: 5c0
	Projectile: PwBullet
		Image: weapon-throw-bomb
		Sequences: flight
		Speed: 240
	Warhead@1Dam: SubtractArmorDamage
		Damage: 45
		# The original damage falls to zero at the 48 px splash radius.
		Range: 0, 1c512
		Falloff: 100, 0
	Report: weapon-throw-bomb-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-throw-bomb
		Explosions: impact
		ImpactSounds: weapon-throw-bomb-1.wav

SoldierArrow:
	Inherits: ^Arrow
	ReloadDelay: 58
	Range: 8c0
	Projectile: PwBullet
		Image: weapon-soldier-arrows
		Sequences: flight
		Speed: 288
	Warhead@1Dam: SubtractArmorDamage
		Damage: 20
	Report: weapon-soldier-arrows-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-soldier-arrows
		Explosions: impact

# Equipped forms: the item adds 15 attack (Item.itm 0xd4).
FireArrow:
	Inherits: SoldierArrow
	ReloadDelay: 80
	Warhead@1Dam: SubtractArmorDamage
		Damage: 35
		# The original damage falls to zero at the 40 px splash radius.
		Range: 0, 1c256
		Falloff: 100, 0
	Report: weapon-fire-arrow-0.wav
	Projectile: PwBullet
		Image: weapon-fire-arrow
		Sequences: flight
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-fire-arrow
		Explosions: impact

VenomArrow:
	Inherits: SoldierArrow
	Inherits@poison: ^Poison
	ReloadDelay: 80
	Warhead@1Dam: SubtractArmorDamage
		Damage: 35
		# The original damage falls to zero at the 32 px splash radius.
		Range: 0, 1c0
		Falloff: 100, 0
	Report: weapon-poison-arrow-0.wav
	Projectile: PwBullet
		Image: weapon-poison-arrow
		Sequences: flight

ShootSword:
	Inherits: ^Arrow
	ValidTargets: Ground
	ReloadDelay: 92
	Range: 6c0
	Projectile: PwBullet
		Image: weapon-shoot-sword-sprit
		Sequences: flight
		Speed: 288
		Mode: 4
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground
		Damage: 45
	Report: weapon-shoot-sword-sprit-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-shoot-sword-sprit
		Explosions: impact

SpearOfJustice:
	Inherits: ShootSword
	ValidTargets: Ground, Air
	ReloadDelay: 96
	Range: 7c0
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground, Air
		Damage: 60

BowMachineArrow:
	Inherits: ^Thrown
	ReloadDelay: 130
	Range: 11c0
	Projectile: PwBullet
		Image: weapon-bow-machine-arrows
		Sequences: flight
		Speed: 288
		LaunchAngle: 0
		Mode: 0
	Warhead@1Dam: SubtractArmorDamage
		Damage: 100
		# The original damage falls to zero at the 32 px splash radius.
		Range: 0, 1c0
		Falloff: 100, 0
	Report: weapon-bow-machine-arrows-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-bow-machine-arrows
		Explosions: impact

ChiefHit:
	Inherits: ^Melee
	ReloadDelay: 74
	Warhead@1Dam: SubtractArmorDamage
		Damage: 80
	Report: weapon-chief-hit-0.wav
	# Two strikes per attack, 7 steps apart (.chr 0x247c: steps 5 and 12).
	Burst: 2
	BurstDelays: 14

# StoneTower: a thrown stone that also reaches flyers (range 288 px against both; 20 px per tick).
Stone:
	Inherits: ^Thrown
	ValidTargets: Ground, Air
	ReloadDelay: 42
	Range: 9c0
	Projectile: PwBullet
		Image: weapon-stone
		Sequences: flight
		Speed: 320
	Warhead@1Dam: SubtractArmorDamage
		ValidTargets: Ground, Air
		Damage: 40
	Report: weapon-stone-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-stone
		Explosions: impact

# Trap: snaps at what stands beside it (32 px from its edge; the range is measured from its centre). Its target mask
# is ground units only (1): hoverers pass over it.
TrapSnap:
	Inherits: ^Melee
	ReloadDelay: 16
	Range: 2c0
	InvalidTargets: Hover
	Warhead@1Dam: SubtractArmorDamage
		Damage: 80
	Report: weapon-trap-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-trap
		Explosions: impact

# Squadron: a shot at ground or air (22 px per tick).
SquadronShot:
	Inherits: ^Arrow
	ReloadDelay: 66
	Range: 6c0
	Projectile: PwBullet
		Image: weapon-squadron-shoot
		Sequences: flight
		Speed: 352
	Warhead@1Dam: SubtractArmorDamage
		Damage: 20
	Report: weapon-squadron-shoot-0.wav
	# No impact effect: only the two spears are seen.

# Flattop: fire at ground or air, splashing 48 px (16 px per tick).
PhantomFire:
	Inherits: ^Arrow
	ReloadDelay: 112
	Range: 7c0
	Projectile: PwBullet
		Image: weapon-phantom-fire
		Sequences: flight
		Speed: 256
		Mode: 0
	Warhead@1Dam: SubtractArmorDamage
		Damage: 75
		# The original damage falls to zero at the 48 px splash radius.
		Range: 0, 1c512
		Falloff: 100, 0
	Report: weapon-phantom-fire-0.wav
	Warhead@2Eff: CreateEffect
		ValidTargets: Ground, Air
		Image: weapon-phantom-fire
		Explosions: impact
