# The actor template tree (plan.md §3.1). Templates hold behaviour, never balance: HP, attack, armour, cost, speed,
# sight and build time live on the concrete actors, with the values from docs/game/<race>.md.
#
# Units in the original are measured in pixels and ticks; here 1 px = 32 WDist (a 32 px cell is 1c0) and one tick
# is one world tick (the game speeds in mod.yaml are the original ones).

# Everything that takes part in a game.
^ExistsInWorld:
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	CombatDebugOverlay:
	ScriptTriggers:
	RenderDebugState:
	HiddenUnderFog:
	HandicapFirepowerMultiplier:
	HandicapDamageMultiplier:
	HandicapProductionTimeMultiplier:

# Drawn from the converted .chr art (sequences/<race>.yaml).
^SpriteActor:
	Inherits: ^ExistsInWorld
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: walk
	RenderSprites:

# A unit, without a movement trait: the movement mixins below add one.
^Unit:
	Inherits: ^SpriteActor
	Buildable:
		BuildDurationModifier: 100
	Huntable:
	OwnerLostAction:
		Action: Kill
	Selectable:
		Priority: 10
		PriorityModifiers: Ctrl
		Bounds: 1024, 1024, 0, -256
		DecorationBounds: 768, 1024, 0, -256
	SelectionDecorations:
	HitShape:
	Health:
	PwArmor:
	RevealsShroud:
	AttackMove:
	Guard:
	Guardable:
	MustBeDestroyed:
	GivesExperience:
	Tooltip:
	WithInfantryBody:
		IdleSequences: stand
		StandSequences: stand
		MoveSequence: walk
		DefaultAttackSequence: attack
	WithDeathAnimation:
		DeathSequence: die
		UseDeathTypeSuffix: false
		CrushedSequence: die
	MapEditorData:
		Categories: Units

^Infantry:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Infantry
	Crushable:

# Workers build (Builder, the build list on the concrete worker) and gather (Phase 3, next step). While building
# they play their build animation instead of the infantry body.
^Worker:
	Inherits: ^Infantry
	Builder:
	BerryGatherer:
	# One body at a time: building, gathering, carrying a basket of berries, or the plain infantry body.
	WithInfantryBody:
		RequiresCondition: !building && !gathering && !carrying
	WithInfantryBody@CARRY:
		IdleSequences: stand-carry-b
		StandSequences: stand-carry-b
		MoveSequence: walk-carry-b
		DefaultAttackSequence: attack
		RequiresCondition: carrying && !building && !gathering
	WithSpriteBody@BUILD:
		Name: build
		Sequence: build
		RequiresCondition: building
	WithSpriteBody@GATHER:
		Name: gather
		Sequence: gather
		RequiresCondition: gathering

# Living creatures that are not people: dinosaurs. Not crushable.
^Beast:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Beast

# Constructed: Bowmachine, flying machines. Repaired, not healed.
^Machine:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Machine

# Movement mixins (§3.1.1): Mobile needs the world's PathFinder and the named Locomotor.
^FootMovement:
	Mobile:
		Locomotor: foot
		AlwaysTurnInPlace: true

^HeavyMovement:
	Mobile:
		Locomotor: heavy
		AlwaysTurnInPlace: true

^WheeledMovement:
	Mobile:
		Locomotor: wheeled
		AlwaysTurnInPlace: true

# Attack mixins.
^Melee:
	AttackFrontal:
		FacingTolerance: 128
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground

^Ranged:
	Inherits: ^Melee

# Buildings (§3.1): Building needs the world's BuildingInfluence.
^Building:
	Inherits: ^SpriteActor
	-QuantizeFacingsFromSequence:
	BodyOrientation:
		QuantizedFacings: 1
	Huntable:
	OwnerLostAction:
		Action: Kill
	Selectable:
		Priority: 3
	SelectionDecorations:
	Targetable:
		TargetTypes: Ground, Structure
	HitShape:
		Type: Rectangle
	Building:
		TerrainTypes: Clear
		RequiresBaseProvider: false
	Health:
	PwArmor:
	RevealsShroud:
	MustBeDestroyed:
		RequiredForShortGame: true
	GivesExperience:
	Tooltip:
	WithSpriteBody:
		Sequence: idle
	# Built by a worker (Builder): grows over the original build time, showing the original construction stages.
	UnderConstruction:
	WithConstructionStages:
	ProvidesPrerequisite:
	Buildable:
		BuildDurationModifier: 100
	MapEditorData:
		Categories: Buildings

# Trains units: its own queue (Type = the building's actor name, which the units' Buildable.Queue names), shown by the
# command panel while it is selected. Nothing is trained while it is still being built.
^ProductionBuilding:
	Inherits: ^Building
	Exit:
	Production:
		RequiresCondition: !constructing
	ProductionQueue:
		Group: Training

# Race mixins (§3.1.2): the race layer (production queue, voices) is filled in with production.
^Primitive:

^Tyrano:

# Map decoration from the original maps (rules/objects.yaml, generated): drawn only, its cells are already blocked by
# the terrain flags.
^Doodad:
	Interactable:
	HiddenUnderShroud:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Immobile:
		OccupiesSpace: false
	MapEditorData:
		Categories: Doodads

# A berry bush (rules/objects.yaml, generated): two cells, blocks them, gathered by workers until empty.
^BerryBush:
	Interactable:
	HiddenUnderShroud:
	Tooltip:
		Name: actor-berry-bush.name
		ShowOwnerRow: false
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Building:
		Footprint: xx
		Dimensions: 2,1
		TerrainTypes: Clear, Ramp
	Targetable:
		TargetTypes: BerryBush
	BerryBush:
	AppearsOnRadar:
	MapEditorData:
		Categories: Resources
