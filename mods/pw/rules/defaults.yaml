	Exit@10:
		ExitCell: -1,2
	Exit@11:
		ExitCell: 6,2
	Exit@12:
		ExitCell: -1,1
	Exit@13:
		ExitCell: 6,1
	Exit@14:
		ExitCell: -1,0
	Exit@15:
		ExitCell: 6,0
	Exit@16:
		ExitCell: -1,-1
	Exit@17:
