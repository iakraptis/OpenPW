# An upgrade level (rules/<race>/upgrades.yaml, generated): researched by its building like a unit, never placed in the
# world. Its icon is the "icon" sequence of its image (sequences/upgrades.yaml).
^Upgrade:
	Interactable:
	Buildable:
		BuildDurationModifier: 100
	Valued:
	Tooltip:
	RenderSprites:
	PwUpgrade:

# An item on the ground (rules/<race>/items.yaml, generated): made by a building and laid beside it, even on an occupied
# cell (it takes up no space); picked up by its owner's unit of the Equips type. Its icon is its button.
^Item:
	Interactable:
	HiddenUnderFog:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Immobile:
		OccupiesSpace: false
	Targetable:
		TargetTypes: Item
	Tooltip:
	Buildable:
		BuildDurationModifier: 100
	Valued:
	PwItem:
	MapEditorData:
		Categories: Items

# Meat on the ground (rules/meat.yaml): left by a killed wild creature, rots, picked up by living units.
^Meat:
	Interactable:
	HiddenUnderFog:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Immobile:
		OccupiesSpace: false
	Targetable:
		TargetTypes: Meat
	Tooltip:
		Name: actor-meat.name
		ShowOwnerRow: false
	PwMeat:
	MapEditorData:
		Categories: Items

# The Chief's morale (docs/game/rules.md): Primitive units near an allied Chief attack and defend 10% better (the
# value is not known from the original). The Chief grants "morale" (ProximityExternalCondition on primitive-chief).
^Morale:
	ExternalCondition@MORALE:
		Condition: morale
	FirepowerMultiplier@MORALE:
		Modifier: 110
		RequiresCondition: morale
	PwArmorMultiplier@MORALE:
		Modifier: 110
		RequiresCondition: morale

# Invisibility (Pw.exe: .chr 0x1f8 bit 0x2 makes a unit invisible from the start, unit flag 0x40; the check is
# 0x4682e0): the Trap, Pixie, MudMan and DeathEye. Its owner and allies see it, see-through (as the original's shaded
# look); anyone else only where one of their detectors is near (DetectCloaked, type Invisible). Attacking doesn't
# reveal it.
# Detectors (.chr 0x1f8 bit 0x1: Revolver, TwinRhamphos, Pixie, DeathEye, Trap, Ascomoid; and the StoneTower, Bubble
# and Volcano once their detection is researched, 0x46832b) detect over their whole sight: each sets DetectCloaked
# with its sight range.
^Invisible:
	Cloak:
		CloakStyle: Alpha
		CloakedAlpha: 0.55
		DetectionTypes: Invisible
		InitialDelay: 0
		UncloakOn: None

# Race mixins (§3.1.2): the race layer (production queue, voices) is filled in with production.
^Primitive:

^Tyrano:

^Demon:

^Elf:

# Elf buildings are conjured (the Wizard's Elf Build, JW2_11 record 17): they have no construction stages, so the
# finished building fades in while the Elf Build sparks play over it. Destroyed, it fades out under the same sparks.
^ElfBuilding:
	WithConstructionStages:
		Sequence: idle
	PwConjured:
	WithIdleOverlay@CONJURE:
		Image: spell-elf-build
		Sequence: effect
		Palette: effect
		RequiresCondition: constructing

# Tyrano disguise (PwDisguise; the help file's Special Abilities): once Disguise is researched, the unit can turn into
# its "original form", a wild creature of its kind, and back. While "disguised" it is drawn as the creature (the unit
# names its image in PwWithDisguiseBody@DISGUISE and the creature in Tooltip@DISGUISE's GenericName) instead of its own
# body, its attacks are off, and it has the Wild target type, which nothing attacks on its own. Enemies see the
# creature's name and the Creeps' colours. Only actors that disguise may use the condition (the lint checks it is
# granted), so there is a mixin per body and attack: ^Disguisable (ground, armed), ^DisguisableFlyer (unarmed) and
# ^DisguisableArmedFlyer.
^DisguiseBase:
	PwDisguise:
		Prerequisites: tyrano-upgrade-disguise-1
	Tooltip:
		RequiresCondition: !disguised
	Tooltip@DISGUISE:
		GenericVisibility: Enemy, Neutral
		ShowOwnerRow: false
		RequiresCondition: disguised
	Targetable@DISGUISE:
		TargetTypes: Wild
		RequiresCondition: disguised

^Disguisable:
	Inherits: ^DisguiseBase
	WithInfantryBody:
		RequiresCondition: !disguised
	PwWithDisguiseBody@DISGUISE:
		IdleSequences: stand
		StandSequences: stand
		MoveSequence: walk
		DefaultAttackSequence: stand
		RequiresCondition: disguised
	# The attack of ^Melee and ^Ranged (PwMeleeAttack, an AttackFrontal).
	PwMeleeAttack:
		RequiresCondition: !disguised
	AutoTarget:
		RequiresCondition: !disguised

# Flyers: the creature's art loops its flight, as theirs does (^LivingFlyer).
^DisguisableFlyer:
	Inherits: ^DisguiseBase
	WithInfantryBody@FLIGHT:
		RequiresCondition: !disguised
	PwWithDisguiseBody@DISGUISE:
		StandSequences: walk
		MoveSequence: walk
		DefaultAttackSequence: walk
		RequiresCondition: disguised

^DisguisableArmedFlyer:
	Inherits: ^DisguisableFlyer
	AttackAircraft:
		RequiresCondition: !disguised
	AutoTarget:
		RequiresCondition: !disguised

# Hoverers (the Rhamphos): the flyers' looping art, a ground attack.
^DisguisableArmedHoverer:
	Inherits: ^DisguisableFlyer
	PwMeleeAttack:
		RequiresCondition: !disguised
	AutoTarget:
		RequiresCondition: !disguised

