# An upgrade level (rules/<race>/upgrades.yaml, generated): researched by its building like a unit, never placed in the
# world. Its icon is the "icon" sequence of its image (sequences/upgrades.yaml).
^Upgrade:
	AlwaysVisible:
	Interactable:
	Buildable:
		BuildDurationModifier: 100
	Valued:
	Tooltip:
	RenderSprites:
	PwUpgrade:

# An item on the ground (rules/<race>/items.yaml, generated): made by a building and laid beside it, even on an occupied
# cell (it takes up no space); picked up by its owner's unit of the Equips type. Its icon is its button.
^Item:
	Interactable:
	HiddenUnderFog:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Immobile:
		OccupiesSpace: false
	Targetable:
		TargetTypes: Item
	Tooltip:
	Buildable:
		BuildDurationModifier: 100
	Valued:
	PwItem:
	MapEditorData:
		Categories: Items

# Meat on the ground (rules/meat.yaml): left by a killed wild creature, rots, picked up by living units.
^Meat:
	Interactable:
	HiddenUnderFog:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Immobile:
		OccupiesSpace: false
	Targetable:
		TargetTypes: Meat
	Tooltip:
		Name: actor-meat.name
		ShowOwnerRow: false
	PwMeat:
	MapEditorData:
		Categories: Items

# The Chief's morale (docs/game/rules.md): Primitive units near an allied Chief attack and defend 10% better (the
# value is not known from the original). The Chief grants "morale" (ProximityExternalCondition on primitive-chief).
^Morale:
	ExternalCondition@MORALE:
		Condition: morale
	FirepowerMultiplier@MORALE:
		Modifier: 110
		RequiresCondition: morale
	PwArmorMultiplier@MORALE:
		Modifier: 110
		RequiresCondition: morale

# Race mixins (§3.1.2): the race layer (production queue, voices) is filled in with production.
^Primitive:

^Tyrano:

# Map decoration from the original maps (rules/objects.yaml, generated): drawn only, its cells are already blocked by
# the terrain flags.
^Doodad:
	Interactable:
	HiddenUnderShroud:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Immobile:
		OccupiesSpace: false
	MapEditorData:
		Categories: Doodads

# A berry bush (rules/objects.yaml, generated): two cells, blocks them, gathered by workers until empty.
^BerryBush:
	Interactable:
	HiddenUnderShroud:
	Tooltip:
		Name: actor-berry-bush.name
		ShowOwnerRow: false
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Building:
		Footprint: xx
		Dimensions: 2,1
		TerrainTypes: Clear, Ramp
	Targetable:
		TargetTypes: BerryBush
	BerryBush:
	AppearsOnRadar:
	MapEditorData:
		Categories: Resources
