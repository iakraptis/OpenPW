# The actor template tree (plan.md §3.1). Templates hold behaviour, never balance: HP, attack, armour, cost, speed,
# sight and build time live on the concrete actors, with the values from docs/game/<race>.md.
#
# Units in the original are measured in pixels and ticks; here 1 px = 32 WDist (a 32 px cell is 1c0) and one tick
# is one world tick (the game speeds in mod.yaml are the original ones).

# Everything that takes part in a game.
^ExistsInWorld:
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	CombatDebugOverlay:
	ScriptTriggers:
	RenderDebugState:
	HiddenUnderFog:
	HandicapFirepowerMultiplier:
	HandicapDamageMultiplier:
	HandicapProductionTimeMultiplier:

# Drawn from the converted .chr art (sequences/<race>.yaml).
^SpriteActor:
	Inherits: ^ExistsInWorld
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: walk
	RenderSprites:

# A unit, without a movement trait: the movement mixins below add one.
^Unit:
	Inherits: ^SpriteActor
	Buildable:
		BuildDurationModifier: 100
	Huntable:
	OwnerLostAction:
		Action: Kill
	Selectable:
		Priority: 10
		PriorityModifiers: Ctrl
		Bounds: 1024, 1024, 0, -256
		DecorationBounds: 768, 1024, 0, -256
	SelectionDecorations:
	HitShape:
	Health:
	PwArmor:
	RevealsShroud:
	AttackMove:
	# Back and forth between two places, attack-moving (the command panel's Patrol).
	PwPatrol:
	Guard:
	Guardable:
	MustBeDestroyed:
	# Its voices (the voice set named like its image) and death sound.
	PwVoiced:
	DeathSounds:
		Voice: Die
	PwAttackVoice:
	# Killing it gives experience: its population (wild creatures set their own).
	PwGivesExperience:
	# Fall out wears it down to 1 HP, with the spell's art on it meanwhile.
	PwFallOutVictim:
	WithIdleOverlay@FALLOUT:
		Image: spell-fall-out
		Sequence: effect
		RequiresCondition: fallout
	# Researched upgrades' attack, armour and speed (PwUpgrades on the player).
	PwUpgradeBonus:
	# Picks up Blacksmith items of its own type (PwItem.Equips) and becomes the item's type.
	PwItemUser:
	Tooltip:
	WithInfantryBody:
		IdleSequences: stand
		StandSequences: stand
		MoveSequence: walk
		DefaultAttackSequence: attack
	# Dead, it falls (its die animation, facing the way it fell) and its body lies for 320 ticks (.chr 0x13d0; flyers
	# and machines set 0), while Resurrect can raise it (Pw.exe 0x460ac0). A Fake copy leaves nothing.
	PwBody:
		RequiresCondition: !illusion
	WithDeathAnimation@ILLUSION:
		DeathSequence: die
		UseDeathTypeSuffix: false
		CrushedSequence: die
		RequiresCondition: illusion
	# Stone curse (a Kelpa's spell, PwSpell) turns it to stone for a while: grey, it can't move or attack (the
	# movement and attack mixins pause on "petrified", "stunned" or "bubbled").
	ExternalCondition@PETRIFIED:
		Condition: petrified
	WithColoredOverlay@PETRIFIED:
		Color: 808080A0
		RequiresCondition: petrified
	# Poison (weapons with ^Poison: the Dilophos's spit, the Venom arrow) stuns it for a moment: tinted green, it
	# can't move or attack.
	ExternalCondition@STUNNED:
		Condition: stunned
	WithColoredOverlay@STUNNED:
		Color: 40FF4080
		RequiresCondition: stunned
	# The Elf Bubble tower's shot traps it in a bubble for a while: it can't move or attack.
	ExternalCondition@BUBBLED:
		Condition: bubbled
	WithIdleOverlay@BUBBLED:
		Image: weapon-bubble
		Sequence: impact
		RequiresCondition: bubbled
	# Shield and Mass temper (Elf spells, PwSpell) give it a shield that soaks up damage, shown meanwhile.
	PwShield:
	WithIdleOverlay@SHIELD:
		Image: spell-shield
		Sequence: effect
		RequiresCondition: shielded
	# Fake (the Unicorn's spell) makes a copy of it, which can't hurt and vanishes after 960 ticks (Fake's 30 x 32,
	# the original's timer for summoned units: Pw.exe 0x4792c2, FUN_0046089a).
	ExternalCondition@ILLUSION:
		Condition: illusion
	FirepowerMultiplier@ILLUSION:
		Modifier: 0
		RequiresCondition: illusion
	KillsSelf@ILLUSION:
		Delay: 960
		RequiresCondition: illusion
	MapEditorData:
		Categories: Units

^Infantry:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Infantry
	# Rides in transports (the Revolver's Cargo takes Ground); each unit sets its Weight (.chr 0x188).
	Passenger:
		CargoType: Ground
	Crushable:
	# Living units carry meat they pick up and eat it while hurt (machines don't).
	PwMeatEater:
	# Its death feeds a Demon's kill points.
	PwLiving:

# Workers build (Builder, the build list on the concrete worker: they go inside the site until it is finished) and
# gather berries.
^Worker:
	Inherits: ^Infantry
	Builder:
	BerryGatherer:
	GatherAtRallyPoint:
	# One body at a time: gathering, carrying a basket of berries, or the plain infantry body.
	WithInfantryBody:
		RequiresCondition: !gathering && !carrying
	WithInfantryBody@CARRY:
		IdleSequences: stand-carry-b
		StandSequences: stand-carry-b
		MoveSequence: walk-carry-b
		DefaultAttackSequence: attack
		RequiresCondition: carrying && !gathering
	WithFacingSpriteBody@GATHER:
		Name: gather
		Sequence: gather
		RequiresCondition: gathering

# Living creatures that are not people: dinosaurs. Not crushable.
^Beast:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Beast
	PwLiving:

# Wild creatures (rules/wild.yaml, generated): placed by the maps, owned by Creeps. They wander around where they
# were placed. Plant-eaters never fight; predators (^WildPredator) attack player units that come close and fight
# back when attacked. Units and towers fight predators on their own (target type Predator) but leave plant-eaters
# alone (target type Wild): those are hunted by order.
^Wild:
	Inherits: ^Beast
	Inherits@move: ^FootMovement
	Targetable:
		TargetTypes: Ground, Beast, Wild
	-Buildable:
	-MustBeDestroyed:
	-AttackMove:
	-PwPatrol:
	-Guard:
	# Hit, a plant-eater runs off and sometimes roars (predators fight back instead).
	PwFleeWhenHit:
	# Heals 1 HP every 32 ticks, leaves meat when killed (its amount is set per creature) and comes back long after.
	PwRegenerates:
	PwDropsMeat:
	PwRespawns:
	Wanders:
		WanderMoveRadius: 4
		MinMoveDelay: 150
		MaxMoveDelay: 600
	MapEditorData:
		Categories: Wildlife

# Predators attack enemy (player) units within ScanRadius cells, a short range, so they only bite what passes by.
^WildPredator:
	Inherits: ^Melee
	-PwHunter:
	-PwWithTextDecoration@HUNTING:
	# Hostile: units and towers fight these on their own (^Melee's AutoTargetPriority@PREDATORS).
	Targetable@PREDATOR:
		TargetTypes: Predator
	AutoTarget:
		InitialStance: AttackAnything
		InitialStanceAI: AttackAnything
		ScanRadius: 3

# Pteranodon, Rhamphorhynchus: fly over everything, only arrows reach them.
^WildFlyer:
	Inherits: ^Wild
	PwTakeOff:
	# No body: it vanishes once it has fallen (.chr 0x13d0 = 0).
	PwBody:
		Ticks: 0
	# The flight loops all the time, standing or moving, with no idle animation: hovering, an aircraft is idle and
	# busy on alternate ticks, and each idle tick restarted the loop (the wings froze on the first frame).
	-WithInfantryBody:
	WithInfantryBody@FLIGHT:
		StandSequences: walk
		MoveSequence: walk
		DefaultAttackSequence: walk
	-Mobile:
	-Targetable:
	Targetable@AIR:
		TargetTypes: Air, Wild
		RequiresCondition: airborne
	Targetable@GROUND:
		TargetTypes: Ground, Beast, Wild
		RequiresCondition: !airborne
	Aircraft:
		# The art draws the flight height and the shadow itself: fly just high enough to count as airborne.
		CruiseAltitude: 16
		CanHover: true
		TurnSpeed: 64
		AirborneCondition: airborne
		Repulsable: false
	HiddenUnderFog:
		Type: CenterPosition
	RevealsShroud:
		Type: CenterPosition

# Plesiosaurs, Peleneustes: water only.
^WildSwimmer:
	Inherits: ^Wild
	Mobile:
		Locomotor: water

# Constructed: Bowmachine, flying machines. Repaired, not healed.
^Machine:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Machine
	# Rides in transports (the Revolver's Cargo takes Ground); each unit sets its Weight (.chr 0x188).
	Passenger:
		CargoType: Ground

# The Tyrano race's ground dinosaurs (not the wildlife): living beasts, not crushable, that carry and eat meat and ride
# the Dsunguri (Cargo Ground; each sets its Weight, .chr 0x188).
^Dinosaur:
	Inherits: ^Beast
	Passenger:
		CargoType: Ground
	PwMeatEater:

# Living flyers (Tyrano: Rhamphos, Pteras, Mutant, the Dsunguri; Demon: Gargoyle, Darkbat, ...): they eat meat. Their
# art has no standing animation: the flight loops all the time (as ^WildFlyer's, an idle hover would restart it
# every other tick).
^LivingFlyer:
	Inherits: ^Unit
	Inherits@move: ^AirMovement
	PwMeatEater:
	PwLiving:
	-WithInfantryBody:
	PwTakeOff:
	WithInfantryBody@FLIGHT:
		StandSequences: walk
		MoveSequence: walk
		DefaultAttackSequence: attack

# Hovering, the original's movement class 2 (.chr 0x17c: Insect, Rhamphos, Warlock, Alien1-2). It moves as a ground
# unit that can also cross water: cliffs, ridges, map objects and units stop it (Pw.exe 0x45cb3c). Weapons pick their
# targets by class (weapon record 0x154, bit = class; FUN_00457c40): every weapon that hits ground units hits it too,
# except the Trap's (mask 1); air-only fire (the Phoenix's, mask 8) doesn't. So it is a Ground target, also of type
# Hover for the weapons that leave it out.
^Hovering:
	Targetable@HOVER:
		TargetTypes: Hover

^HoverMovement:
	Mobile:
		Locomotor: hover
		AlwaysTurnInPlace: true
		PauseOnCondition: petrified || stunned || bubbled

# Living hoverers: their art always flaps (no stand animation), as the flyers'.
^LivingHoverer:
	Inherits: ^Unit
	Inherits@move: ^HoverMovement
	Inherits@hover: ^Hovering
	Targetable:
		TargetTypes: Ground, Beast
	PwMeatEater:
	PwLiving:
	-WithInfantryBody:
	WithInfantryBody@FLIGHT:
		StandSequences: walk
		MoveSequence: walk
		DefaultAttackSequence: attack

# The Demon race's bodies: their health is their kill points (PwKillPoints), lost to damage and to their spells,
# regained from kills. ^Fiend walks (people-sized, ^Infantry); flying Demons are ^LivingFlyer with PwKillPoints.
^Fiend:
	Inherits: ^Infantry
	PwKillPoints:

^FlyingFiend:
	Inherits: ^LivingFlyer
	PwKillPoints:

^HoveringFiend:
	Inherits: ^LivingHoverer
	PwKillPoints:

# Movement mixins (§3.1.1): Mobile needs the world's PathFinder and the named Locomotor.
^FootMovement:
	Mobile:
		Locomotor: foot
		AlwaysTurnInPlace: true
		PauseOnCondition: petrified || stunned || bubbled

^HeavyMovement:
	Mobile:
		Locomotor: heavy
		AlwaysTurnInPlace: true
		PauseOnCondition: petrified || stunned || bubbled

^WheeledMovement:
	Mobile:
		Locomotor: wheeled
		AlwaysTurnInPlace: true
		PauseOnCondition: petrified || stunned || bubbled

# Flying machines (Revolver, Squadron, Flattop): hover over any terrain; only the Revolver lands (to load). In the air only weapons
# that reach it (arrows, stones) hit them; landed they count as ground units. Units using it inherit ^Unit directly
# (not ^Machine), since these targetables replace the ground one.
^AirMovement:
	# No body: it vanishes once it has fallen (.chr 0x13d0 = 0 for every flyer).
	PwBody:
		Ticks: 0
	Targetable@AIR:
		TargetTypes: Air, Machine
		RequiresCondition: airborne
	Targetable@GROUND:
		TargetTypes: Ground, Machine
		RequiresCondition: !airborne
	Aircraft:
		# The art draws the flight height and the shadow itself: fly just high enough to count as airborne.
		CruiseAltitude: 16
		CanHover: true
		VTOL: true
		TurnSpeed: 64
		AirborneCondition: airborne
		PauseOnCondition: petrified || stunned || bubbled
	HiddenUnderFog:
		Type: CenterPosition
	RevealsShroud:
		Type: CenterPosition

# Attack mixins.
^Melee:
	# AttackFrontal, except that a unit which cannot get next to its target fights another enemy near it.
	PwMeleeAttack:
		FacingTolerance: 128
		PauseOnCondition: petrified || stunned || bubbled
	AutoTarget:
		# Units scan 5 cells and go for enemies they see, as OpenSYW's infantry do.
		ScanRadius: 5
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground
		InvalidTargets: Wild
		ValidRelationships: Enemy
	# Hunting, toggled with the command panel's Hunt button: wild creatures around it, then their meat. While on, an H
	# at the bottom left of its selection box (the original's H mark), for its owner and allies.
	PwHunter:
		HuntingCondition: hunting
	PwWithTextDecoration@HUNTING:
		Text: H
		Font: TinyBold
		Color: FFD700
		Position: BottomLeft
		RequiresCondition: hunting
	# Hostile wild creatures (predators) are fought on their own, like enemy units; plant-eaters only when hunting.
	AutoTargetPriority@PREDATORS:
		ValidTargets: Predator

# Ranged units also pick flying targets on their own, when their weapon reaches the air (arrows yes, bombs no).
# Flying attackers: fire while hovering, at ground and air targets; they take off as soon as they appear.
^AirAttack:
	PwTakeOff:
	AttackAircraft:
		AttackType: Hover
		FacingTolerance: 128
		PauseOnCondition: petrified || stunned || bubbled
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, Air
		InvalidTargets: Wild
	# Hunting, toggled with the command panel's Hunt button: wild creatures around it, then their meat. While on, an H
	# at the bottom left of its selection box (the original's H mark), for its owner and allies.
	PwHunter:
		HuntingCondition: hunting
	PwWithTextDecoration@HUNTING:
		Text: H
		Font: TinyBold
		Color: FFD700
		Position: BottomLeft
		RequiresCondition: hunting
	# Hostile wild creatures (predators) are fought on their own, like enemy units; plant-eaters only when hunting.
	AutoTargetPriority@PREDATORS:
		ValidTargets: Predator

^Ranged:
	Inherits: ^Melee
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, Air

# Buildings (§3.1): Building needs the world's BuildingInfluence.
^Building:
	Inherits: ^SpriteActor
	-QuantizeFacingsFromSequence:
	BodyOrientation:
		QuantizedFacings: 1
	Huntable:
	OwnerLostAction:
		Action: Kill
	Selectable:
		Priority: 3
	SelectionDecorations:
	Targetable:
		TargetTypes: Ground, Structure
	# Targetable at every footprint cell, so melee units can reach a building from any side.
	HitShape:
		Type: Rectangle
		UseTargetableCellsOffsets: true
	Building:
		TerrainTypes: Clear
		RequiresBaseProvider: false
	Health:
	PwArmor:
	RevealsShroud:
	MustBeDestroyed:
		RequiredForShortGame: true
	Tooltip:
	WithSpriteBody:
		Sequence: idle
	# The global select and destroyed sounds of its kind (voices/units.yaml).
	PwVoiced:
	DeathSounds:
		Voice: Die
	# Built by a worker (Builder): grows over the original build time, showing the original construction stages.
	UnderConstruction:
	WithConstructionStages:
	ProvidesPrerequisite:
		RequiresCondition: !constructing
	Buildable:
		BuildDurationModifier: 100
	MapEditorData:
		Categories: Buildings

# Trains units or researches upgrades (the LandIncreaser and SkyIncreaser only research): its own queue (Type = the building's actor name, which the units' Buildable.Queue names), shown by the
# command panel while it is selected. Nothing is trained while it is still being built. Its exits come from the
# ^Exits template of its footprint size.
^ProductionBuilding:
	Inherits: ^Building
	Production:
		RequiresCondition: !constructing
	# Rally point (after OpenSYW): select the building and right-click the ground; trained units walk there. A
	# worker sent to a berry bush starts gathering there (GatherAtRallyPoint).
	RallyPoint:
		Cursor: move
		CirclesSequence: flag
	PwProductionQueue:
		Group: Training
		PopulationLimitTextNotification: notification-population-limit

# Towers and traps (StoneTower, Trap, Ascomoid): attack in every direction (AttackOmni) whatever enemy is in range,
# once built; each sets its Armament (with RequiresCondition: !constructing). They also strike hostile wild
# creatures (^Melee).
^Defense:
	Inherits: ^Building
	AttackOmni:
		RequiresCondition: !constructing
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, Air
		InvalidTargets: Wild
	AutoTargetPriority@PREDATORS:
		ValidTargets: Predator

# Exit cells all around a footprint (corners included): a trained unit walks out to a random free cell along the
