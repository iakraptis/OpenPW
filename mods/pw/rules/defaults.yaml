# The actor template tree (plan.md §3.1). Templates hold behaviour, never balance: HP, attack, armour, cost, speed,
# sight and build time live on the concrete actors, with the values from docs/game/<race>.md.
#
# Units in the original are measured in pixels and ticks; here 1 px = 32 WDist (a 32 px cell is 1c0) and one tick
# is one world tick (the game speeds in mod.yaml are the original ones).

# Everything that takes part in a game.
^ExistsInWorld:
	AppearsOnRadar:
	UpdatesPlayerStatistics:
	CombatDebugOverlay:
	ScriptTriggers:
	RenderDebugState:
	HiddenUnderFog:
	HandicapFirepowerMultiplier:
	HandicapDamageMultiplier:
	HandicapProductionTimeMultiplier:

# Drawn from the converted .chr art (sequences/<race>.yaml).
^SpriteActor:
	Inherits: ^ExistsInWorld
	BodyOrientation:
	QuantizeFacingsFromSequence:
		Sequence: walk
	RenderSprites:

# A unit, without a movement trait: the movement mixins below add one.
^Unit:
	Inherits: ^SpriteActor
	Buildable:
		BuildDurationModifier: 100
	Huntable:
	OwnerLostAction:
		Action: Kill
	Selectable:
		Priority: 10
		PriorityModifiers: Ctrl
		Bounds: 1024, 1024, 0, -256
		DecorationBounds: 768, 1024, 0, -256
	SelectionDecorations:
	HitShape:
	Health:
	PwArmor:
	RevealsShroud:
	AttackMove:
	Guard:
	Guardable:
	MustBeDestroyed:
	# Its voices (the voice set named like its image) and death sound.
	PwVoiced:
	DeathSounds:
		Voice: Die
	PwAttackVoice:
	# Killing it gives experience: its population (wild creatures set their own).
	PwGivesExperience:
	# Fall out wears it down to 1 HP, with the spell's art on it meanwhile.
	PwFallOutVictim:
	WithIdleOverlay@FALLOUT:
		Image: spell-fall-out
		Sequence: effect
		RequiresCondition: fallout
	# Researched upgrades' attack, armour and speed (PwUpgrades on the player).
	PwUpgradeBonus:
	# Picks up Blacksmith items of its own type (PwItem.Equips) and becomes the item's type.
	PwItemUser:
	Tooltip:
	WithInfantryBody:
		IdleSequences: stand
		StandSequences: stand
		MoveSequence: walk
		DefaultAttackSequence: attack
	WithDeathAnimation:
		DeathSequence: die
		UseDeathTypeSuffix: false
		CrushedSequence: die
	MapEditorData:
		Categories: Units

^Infantry:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Infantry
	# Rides in transports (the Revolver's Cargo takes Ground); each unit sets its Weight (.chr 0x188).
	Passenger:
		CargoType: Ground
	Crushable:
	# Living units carry meat they pick up and eat it while hurt (machines don't).
	PwMeatEater:

# Workers build (Builder, the build list on the concrete worker: they go inside the site until it is finished) and
# gather berries.
^Worker:
	Inherits: ^Infantry
	Builder:
	BerryGatherer:
	# One body at a time: gathering, carrying a basket of berries, or the plain infantry body.
	WithInfantryBody:
		RequiresCondition: !gathering && !carrying
	WithInfantryBody@CARRY:
		IdleSequences: stand-carry-b
		StandSequences: stand-carry-b
		MoveSequence: walk-carry-b
		DefaultAttackSequence: attack
		RequiresCondition: carrying && !gathering
	WithSpriteBody@GATHER:
		Name: gather
		Sequence: gather
		RequiresCondition: gathering

# Living creatures that are not people: dinosaurs. Not crushable.
^Beast:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Beast

# Wild creatures (rules/wild.yaml, generated): placed by the maps, owned by Creeps. They wander around where they
# were placed. Plant-eaters never fight; predators (^WildPredator) attack player units that come close and fight
# back when attacked. Units don't pick wild creatures as targets on their own (target type Wild): they are hunted
# by order.
^Wild:
	Inherits: ^Beast
	Inherits@move: ^FootMovement
	Targetable:
		TargetTypes: Ground, Beast, Wild
	-Buildable:
	-MustBeDestroyed:
	-AttackMove:
	-Guard:
	# Hit, a plant-eater runs off and sometimes roars (predators fight back instead).
	PwFleeWhenHit:
	# Heals 1 HP every 32 ticks, leaves meat when killed (its amount is set per creature) and comes back long after.
	PwRegenerates:
	PwDropsMeat:
	PwRespawns:
	Wanders:
		WanderMoveRadius: 4
		MinMoveDelay: 150
		MaxMoveDelay: 600
	MapEditorData:
		Categories: Wildlife

# Predators attack enemy (player) units within ScanRadius cells, a short range, so they only bite what passes by.
^WildPredator:
	Inherits: ^Melee
	-PwHunter:
	# Hostile: AI players' units fight these on their own (^Melee's AutoTargetPriority@PREDATORS).
	Targetable@PREDATOR:
		TargetTypes: Predator
	AutoTarget:
		InitialStance: AttackAnything
		InitialStanceAI: AttackAnything
		ScanRadius: 3

# Pteranodon, Rhamphorhynchus: fly over everything, only arrows reach them.
^WildFlyer:
	Inherits: ^Wild
	PwTakeOff:
	-Mobile:
	-Targetable:
	Targetable@AIR:
		TargetTypes: Air, Wild
		RequiresCondition: airborne
	Targetable@GROUND:
		TargetTypes: Ground, Beast, Wild
		RequiresCondition: !airborne
	Aircraft:
		# The art draws the flight height and the shadow itself: fly just high enough to count as airborne.
		CruiseAltitude: 16
		CanHover: true
		TurnSpeed: 64
		AirborneCondition: airborne
		Repulsable: false
	HiddenUnderFog:
		Type: CenterPosition
	RevealsShroud:
		Type: CenterPosition

# Plesiosaurs, Peleneustes: water only.
^WildSwimmer:
	Inherits: ^Wild
	Mobile:
		Locomotor: water

# Constructed: Bowmachine, flying machines. Repaired, not healed.
^Machine:
	Inherits: ^Unit
	Targetable:
		TargetTypes: Ground, Machine
	# Rides in transports (the Revolver's Cargo takes Ground); each unit sets its Weight (.chr 0x188).
	Passenger:
		CargoType: Ground

# Movement mixins (§3.1.1): Mobile needs the world's PathFinder and the named Locomotor.
^FootMovement:
	Mobile:
		Locomotor: foot
		AlwaysTurnInPlace: true

^HeavyMovement:
	Mobile:
		Locomotor: heavy
		AlwaysTurnInPlace: true

^WheeledMovement:
	Mobile:
		Locomotor: wheeled
		AlwaysTurnInPlace: true

# Flying machines (Revolver, Squadron, Flattop): hover over any terrain; only the Revolver lands (to load). In the air only weapons
# that reach it (arrows, stones) hit them; landed they count as ground units. Units using it inherit ^Unit directly
# (not ^Machine), since these targetables replace the ground one.
^AirMovement:
	Targetable@AIR:
		TargetTypes: Air, Machine
		RequiresCondition: airborne
	Targetable@GROUND:
		TargetTypes: Ground, Machine
		RequiresCondition: !airborne
	Aircraft:
		# The art draws the flight height and the shadow itself: fly just high enough to count as airborne.
		CruiseAltitude: 16
		CanHover: true
		VTOL: true
		TurnSpeed: 64
		AirborneCondition: airborne
	HiddenUnderFog:
		Type: CenterPosition
	RevealsShroud:
		Type: CenterPosition

# Attack mixins.
^Melee:
	AttackFrontal:
		FacingTolerance: 128
	AutoTarget:
		# Units scan 5 cells and go for enemies they see, as OpenSYW's infantry do.
		ScanRadius: 5
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground
		InvalidTargets: Wild
		ValidRelationships: Enemy
	# Hunting, toggled with the command panel's Hunt button: wild creatures around it, then their meat.
	PwHunter:
	# AI players' units also fight hostile wild creatures on their own (players' units leave all wild ones alone).
	GrantConditionOnBotOwner@predators:
		Condition: bot-owned
		Bots: normal, hard
	AutoTargetPriority@PREDATORS:
		ValidTargets: Predator
		RequiresCondition: bot-owned

# Ranged units also pick flying targets on their own, when their weapon reaches the air (arrows yes, bombs no).
# Flying attackers: fire while hovering, at ground and air targets; they take off as soon as they appear.
^AirAttack:
	PwTakeOff:
	AttackAircraft:
		AttackType: Hover
		FacingTolerance: 128
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, Air
		InvalidTargets: Wild
	# Hunting, toggled with the command panel's Hunt button: wild creatures around it, then their meat.
	PwHunter:
	# AI players' units also fight hostile wild creatures on their own (players' units leave all wild ones alone).
	GrantConditionOnBotOwner@predators:
		Condition: bot-owned
		Bots: normal, hard
	AutoTargetPriority@PREDATORS:
		ValidTargets: Predator
		RequiresCondition: bot-owned

^Ranged:
	Inherits: ^Melee
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, Air

# Buildings (§3.1): Building needs the world's BuildingInfluence.
^Building:
	Inherits: ^SpriteActor
	-QuantizeFacingsFromSequence:
	BodyOrientation:
		QuantizedFacings: 1
	Huntable:
	OwnerLostAction:
		Action: Kill
	Selectable:
		Priority: 3
	SelectionDecorations:
	Targetable:
		TargetTypes: Ground, Structure
	# Targetable at every footprint cell, so melee units can reach a building from any side.
	HitShape:
		Type: Rectangle
		UseTargetableCellsOffsets: true
	Building:
		TerrainTypes: Clear
		RequiresBaseProvider: false
	Health:
	PwArmor:
	RevealsShroud:
	MustBeDestroyed:
		RequiredForShortGame: true
	Tooltip:
	WithSpriteBody:
		Sequence: idle
	# The global select and destroyed sounds of its kind (voices/units.yaml).
	PwVoiced:
	DeathSounds:
		Voice: Die
	# Built by a worker (Builder): grows over the original build time, showing the original construction stages.
	UnderConstruction:
	WithConstructionStages:
	ProvidesPrerequisite:
		RequiresCondition: !constructing
	Buildable:
		BuildDurationModifier: 100
	MapEditorData:
		Categories: Buildings

# Trains units or researches upgrades (the LandIncreaser and SkyIncreaser only research): its own queue (Type = the building's actor name, which the units' Buildable.Queue names), shown by the
# command panel while it is selected. Nothing is trained while it is still being built. Its exits come from the
# ^Exits template of its footprint size.
^ProductionBuilding:
	Inherits: ^Building
	Production:
		RequiresCondition: !constructing
	PwProductionQueue:
		Group: Training
		PopulationLimitTextNotification: notification-population-limit

# Exit cells all around a footprint (corners included): a trained unit walks out to a random free cell along the
# front (the bottom row, Priority 2), or to the sides and back when the front is blocked.
^Exits5x3:
