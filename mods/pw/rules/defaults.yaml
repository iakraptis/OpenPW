# An upgrade level (rules/<race>/upgrades.yaml, generated): researched by its building like a unit, never placed in the
# world. Its icon is the "icon" sequence of its image (sequences/upgrades.yaml).
^Upgrade:
	AlwaysVisible:
	Interactable:
	Buildable:
		BuildDurationModifier: 100
	Valued:
	Tooltip:
	RenderSprites:
	PwUpgrade:

# Race mixins (§3.1.2): the race layer (production queue, voices) is filled in with production.
^Primitive:

^Tyrano:

# Map decoration from the original maps (rules/objects.yaml, generated): drawn only, its cells are already blocked by
# the terrain flags.
^Doodad:
	Interactable:
	HiddenUnderShroud:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Immobile:
		OccupiesSpace: false
	MapEditorData:
		Categories: Doodads

# A berry bush (rules/objects.yaml, generated): two cells, blocks them, gathered by workers until empty.
^BerryBush:
	Interactable:
	HiddenUnderShroud:
	Tooltip:
		Name: actor-berry-bush.name
		ShowOwnerRow: false
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
	WithSpriteBody:
	Building:
		Footprint: xx
		Dimensions: 2,1
		TerrainTypes: Clear, Ramp
	Targetable:
		TargetTypes: BerryBush
	BerryBush:
	AppearsOnRadar:
	MapEditorData:
		Categories: Resources
