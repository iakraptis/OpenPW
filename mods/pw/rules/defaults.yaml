	Exit@12:
		ExitCell: 5,0
	Exit@13:
		ExitCell: -1,-1
	Exit@14:
		ExitCell: 0,-1
	Exit@15:
		ExitCell: 1,-1
	Exit@16:
		ExitCell: 2,-1
	Exit@17:
		ExitCell: 3,-1
	Exit@18:
