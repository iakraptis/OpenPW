# The wild creatures' rules: edited by hand, this file is their source. Their values came from the original's .chr
# type records (docs/game/wild.md; first written by research/tools/wild_rules.py, not to be run again over it); the
# templates are in rules/defaults.yaml. Wild creatures are placed by the maps (OBC) and owned by Creeps.

wild-tyranosaurus:
	Inherits: ^Wild
	Inherits@attack: ^WildPredator
	# Its body lies 480 ticks (.chr 0x13d0).
	PwBody:
		Ticks: 480
	# Mod change: it sees invisible units within 10 cells (no wild creature is a detector in the original, .chr 0x1f8).
	DetectCloaked:
		Range: 10c0
		DetectionTypes: Invisible
	Tooltip:
		Name: actor-wild-tyranosaurus.name
	Health:
		HP: 3000
	PwGivesExperience:
		Experience: 40
	PwDropsMeat:
		Amount: 400
	Mobile:
		Speed: 172
	RevealsShroud:
		Range: 10c0
	Armament:
		Weapon: TyranosaurusBite
		FireDelay: 7

