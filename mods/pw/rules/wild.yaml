	Health:
		HP: 800
	PwArmor:
		Value: 20
	Aircraft:
		Speed: 96
	RevealsShroud:
		Range: 11c0
	WithInfantryBody@FLIGHT:
		DefaultAttackSequence: attack
	Armament:
		Weapon: Alien3Hit
		# Strikes on step 4 of its attack animation (.chr 0x247c).
		FireDelay: 8

