# The campaign's aliens (P08), from their .chr records 83-85. Speeds are the original px per tick x 16 (two world
# ticks to one original tick). Alien1 and Alien2 hover (.chr 0x17c = 2) and shoot (JW2_12 Alien.wpn); Alien3 flies
# and strikes.
wild-alien1:
	Inherits: ^Wild
	Inherits@move: ^HoverMovement
	Inherits@hover: ^Hovering
	Inherits@attack: ^WildPredator
	# Hostile: no meat, no coming back, no running off.
	-PwDropsMeat:
	-PwRespawns:
	-PwFleeWhenHit:
	Tooltip:
		Name: actor-wild-alien1.name
	Health:
		HP: 200
	PwArmor:
		Value: 5
	Mobile:
		Speed: 112
	RevealsShroud:
		Range: 10c0
	WithInfantryBody:
		IdleSequences: walk
		StandSequences: walk
	Armament:
		Weapon: Alien1Shot

wild-alien2:
	Inherits: ^Wild
	Inherits@move: ^HoverMovement
	Inherits@hover: ^Hovering
	Inherits@attack: ^WildPredator
	# Hostile: no meat, no coming back, no running off.
	-PwDropsMeat:
	-PwRespawns:
	-PwFleeWhenHit:
	Tooltip:
		Name: actor-wild-alien2.name
	Health:
		HP: 500
	PwArmor:
		Value: 10
	PwGivesExperience:
		Experience: 4
	Mobile:
		Speed: 112
	RevealsShroud:
		Range: 10c0
	WithInfantryBody:
		IdleSequences: walk
		StandSequences: walk
	Armament:
		Weapon: Alien2Shot

wild-alien3:
	Inherits: ^WildFlyer
	Inherits@attack: ^WildAirPredator
	# Hostile: no meat, no coming back, no running off.
	-PwDropsMeat:
	-PwRespawns:
	-PwFleeWhenHit:
	Tooltip:
