# The AI, after OpenSYW's (modelled on the C&C ModularBot setup). Our modules play any faction from its traits:
# - PwBaseBuilderBotModule: workers (Builder) put up the base around the drop-off; houses (ProvidesPopulation only)
#   when the population is nearly full; every other building by its share.
# - PwGathererBotModule: idle workers (BerryGatherer) to the berry bushes.
# - PwUnitBuilderBotModule: every training queue: workers, then research when rich, then a weighted army mix.
# - PwTransportBotModule: transports (aircraft with Cargo) fly soldiers to enemy buildings out of walking reach, or
#   raid the least defended one.
# - PwAbilityBotModule: casters (the Chief's Fall out) strike the strongest enemy near them; the unlocking research
#   comes first once the bot has a caster.
# - PwDefenseBotModule: the nearest armed units answer any attack on the bot (wild creatures included), and hostile
#   wild creatures near the base and its workers are attacked first. Its units also fight predators on their own
#   (AutoTargetPriority@PREDATORS, rules/defaults.yaml).
# - PwHuntingBotModule: army units near the base hunt (the Hunt toggle): wild creatures around them, then the meat.
# - PwMergeBotModule: Tyrano units waiting at the base merge (TwinVelocis, Mutant, one TwinRhamphos to see invisible
#   units); the Mutant Morphosis research comes first once the bot has a part.
# The stock SquadManagerBotModule attacks and defends; it takes type names, so a new faction adds its workers to
# ExcludeFromSquadsTypes, its main building to ConstructionYardTypes, its air units to AirUnitsTypes and what it
# defends to ProtectionTypes. The weights and limits below only tune them; types not listed use the defaults.
player:
	ModularBot@Normal:
		Name: bot-normal.name
		Type: normal
	ModularBot@Hard:
		Name: bot-hard.name
		Type: hard
	GrantConditionOnBotOwner@normal:
		Condition: enable-normal-ai
		Bots: normal
	GrantConditionOnBotOwner@hard:
		Condition: enable-hard-ai
		Bots: hard

	# ------------------------------------------------------------------ Normal

	PwBaseBuilderBotModule@normal:
		RequiresCondition: enable-normal-ai
		BuildingLimits:
			primitive-powerhouse: 2
			primitive-soldierhouse: 2
			primitive-trap: 2
			tyrano-eggnest: 2
			demon-deathden: 2
			elf-redhall: 2
	PwGathererBotModule@normal:
		RequiresCondition: enable-normal-ai
	PwUnitBuilderBotModule@normal:
		RequiresCondition: enable-normal-ai
		# Tyrano units have no armour of their own: the mutations come first (the races' other research waits for cash).
		PriorityResearch: tyrano-upgrade-ground-dino-mutation-armor, tyrano-upgrade-ground-dinos-mutation-weapon
		UnitWeights:
			primitive-powerman: 20
			primitive-soldier: 20
			primitive-giant: 10
			primitive-knight: 12
			primitive-bowmachine: 8
			primitive-squadron: 6
			primitive-flattop: 4
			primitive-chief: 3
			tyrano-masos: 10
			tyrano-velocis: 24
			tyrano-dilophos: 20
			tyrano-trices: 12
			tyrano-eggthrower: 8
			tyrano-rhamphos: 8
			tyrano-pteras: 10
			tyrano-tyranos: 3
			demon-skeleton: 20
			demon-mudman: 15
			demon-kelpa: 12
			demon-kingdemon: 10
			demon-darkbat: 8
			demon-gargoyle: 6
			demon-devil: 3
			elf-redelf: 20
			elf-whiteelf: 14
			elf-ranger: 15
			elf-blueelf: 12
			elf-phoenix: 6
			elf-dragon: 6
			elf-angelelf: 3
		UnitLimits:
			primitive-chief: 1
			tyrano-tyranos: 1
			demon-devil: 1
			elf-angelelf: 1
	PwTransportBotModule@normal:
		RequiresCondition: enable-normal-ai
	PwAbilityBotModule@normal:
		RequiresCondition: enable-normal-ai
	PwDefenseBotModule@normal:
		RequiresCondition: enable-normal-ai
	PwHuntingBotModule@normal:
		RequiresCondition: enable-normal-ai
	PwMergeBotModule@normal:
		RequiresCondition: enable-normal-ai
		Into:
			tyrano-twinvelocis: 0
			tyrano-mutant: 0
			tyrano-twinrhamphos: 1
	SquadManagerBotModule@normal:
		RequiresCondition: enable-normal-ai
		SquadSize: 8
		# Attack waves go for the other players, not wild creatures (PwDefenseBotModule deals with those).
		IgnoredEnemyTargetTypes: Wild
		ExcludeFromSquadsTypes: primitive-buildman, primitive-revolver, tyrano-dinos, tyrano-dsunguri, tyrano-twinrhamphos, demon-insect, demon-phantom, demon-deatheye, elf-wizard, elf-elfring, elf-pixie
		ConstructionYardTypes: primitive-sanctuary, tyrano-tyranonest, demon-demonden, elf-heaven
		AirUnitsTypes: primitive-squadron, primitive-flattop, tyrano-rhamphos, tyrano-pteras, tyrano-mutant, demon-darkbat, demon-gargoyle, elf-phoenix, elf-dragon, elf-angelelf
		ProtectionTypes: primitive-sanctuary, primitive-house, primitive-powerhouse, primitive-soldierhouse, primitive-skyhouse, primitive-blacksmith, primitive-landincreaser, primitive-skyincreaser, primitive-stonetower, primitive-buildman, tyrano-tyranonest, tyrano-nest, tyrano-eggnest, tyrano-landnest, tyrano-skynest, tyrano-thrownest, tyrano-upgradenest, tyrano-landnisdos, tyrano-skynisdos, tyrano-ascomoid, tyrano-dinos, demon-demonden, demon-tomb, demon-deathden, demon-flyden, demon-magicden, demon-hell, demon-dirtyportal, demon-highportal, demon-volcano, demon-insect, elf-heaven, elf-elftree, elf-redhall, elf-bluehall, elf-manahall, elf-skyhall, elf-elflibrary, elf-skylibrary, elf-manalibrary, elf-bubble, elf-wizard

	# ------------------------------------------------------------------ Hard: a bigger economy, building two at a
	# time, quicker decisions and larger attack waves.

	PwBaseBuilderBotModule@hard:
		RequiresCondition: enable-hard-ai
		DecisionInterval: 40
		MaxConcurrentConstructions: 2
		MinimumWorkers: 6
		CashReserve: 100
		PopulationMargin: 5
		BuildingLimits:
			primitive-powerhouse: 2
			primitive-soldierhouse: 2
			primitive-stonetower: 4
			primitive-trap: 3
			tyrano-eggnest: 2
			tyrano-ascomoid: 4
			demon-deathden: 2
			demon-volcano: 4
			elf-redhall: 2
			elf-bubble: 4
	PwGathererBotModule@hard:
		RequiresCondition: enable-hard-ai
	PwUnitBuilderBotModule@hard:
		RequiresCondition: enable-hard-ai
		# Tyrano units have no armour of their own: the mutations come first (the races' other research waits for cash).
		PriorityResearch: tyrano-upgrade-ground-dino-mutation-armor, tyrano-upgrade-ground-dinos-mutation-weapon
		MinimumWorkers: 8
		MaximumWorkers: 16
		ResearchCash: 1000
		UnitWeights:
			primitive-powerman: 20
			primitive-soldier: 20
			primitive-giant: 12
			primitive-knight: 14
			primitive-bowmachine: 10
			primitive-squadron: 6
			primitive-flattop: 5
			primitive-chief: 4
			tyrano-masos: 10
			tyrano-velocis: 24
			tyrano-dilophos: 20
			tyrano-trices: 14
			tyrano-eggthrower: 10
			tyrano-rhamphos: 8
			tyrano-pteras: 10
			tyrano-tyranos: 4
			demon-skeleton: 20
			demon-mudman: 15
			demon-kelpa: 14
			demon-kingdemon: 12
			demon-darkbat: 8
			demon-gargoyle: 6
			demon-devil: 4
			elf-redelf: 20
			elf-whiteelf: 14
			elf-ranger: 15
			elf-blueelf: 14
			elf-phoenix: 6
			elf-dragon: 8
			elf-angelelf: 4
		UnitLimits:
			primitive-chief: 1
			tyrano-tyranos: 1
			demon-devil: 1
			elf-angelelf: 1
	PwTransportBotModule@hard:
		RequiresCondition: enable-hard-ai
		MinimumPassengers: 5
		RaidArmy: 12
		Cooldown: 500
	PwAbilityBotModule@hard:
		RequiresCondition: enable-hard-ai
	PwDefenseBotModule@hard:
		RequiresCondition: enable-hard-ai
	PwHuntingBotModule@hard:
		RequiresCondition: enable-hard-ai
	PwMergeBotModule@hard:
		RequiresCondition: enable-hard-ai
		Into:
			tyrano-twinvelocis: 0
			tyrano-mutant: 0
			tyrano-twinrhamphos: 1
	SquadManagerBotModule@hard:
		RequiresCondition: enable-hard-ai
		SquadSize: 12
		SquadSizeRandomBonus: 6
		# Attack waves go for the other players, not wild creatures (PwDefenseBotModule deals with those).
		IgnoredEnemyTargetTypes: Wild
		ExcludeFromSquadsTypes: primitive-buildman, primitive-revolver, tyrano-dinos, tyrano-dsunguri, tyrano-twinrhamphos, demon-insect, demon-phantom, demon-deatheye, elf-wizard, elf-elfring, elf-pixie
		ConstructionYardTypes: primitive-sanctuary, tyrano-tyranonest, demon-demonden, elf-heaven
		AirUnitsTypes: primitive-squadron, primitive-flattop, tyrano-rhamphos, tyrano-pteras, tyrano-mutant, demon-darkbat, demon-gargoyle, elf-phoenix, elf-dragon, elf-angelelf
		ProtectionTypes: primitive-sanctuary, primitive-house, primitive-powerhouse, primitive-soldierhouse, primitive-skyhouse, primitive-blacksmith, primitive-landincreaser, primitive-skyincreaser, primitive-stonetower, primitive-buildman, tyrano-tyranonest, tyrano-nest, tyrano-eggnest, tyrano-landnest, tyrano-skynest, tyrano-thrownest, tyrano-upgradenest, tyrano-landnisdos, tyrano-skynisdos, tyrano-ascomoid, tyrano-dinos, demon-demonden, demon-tomb, demon-deathden, demon-flyden, demon-magicden, demon-hell, demon-dirtyportal, demon-highportal, demon-volcano, demon-insect, elf-heaven, elf-elftree, elf-redhall, elf-bluehall, elf-manahall, elf-skyhall, elf-elflibrary, elf-skylibrary, elf-manalibrary, elf-bubble, elf-wizard
