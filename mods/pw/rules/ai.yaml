# The AI, after OpenSYW's (modelled on the C&C ModularBot setup). Our modules play any faction from its traits:
# - PwBaseBuilderBotModule: workers (Builder) put up the base around the drop-off; houses (ProvidesPopulation only)
#   when the population is nearly full; every other building by its share.
# - PwGathererBotModule: idle workers (BerryGatherer) to the berry bushes.
# - PwUnitBuilderBotModule: every training queue: workers, then research when rich, then a weighted army mix.
# - PwTransportBotModule: transports (aircraft with Cargo) fly soldiers to enemy buildings out of walking reach, or
#   raid the least defended one.
# - PwAbilityBotModule: casters (the Chief's Fall out) strike the strongest enemy near them; the unlocking research
#   comes first once the bot has a caster.
# - PwDefenseBotModule: the nearest armed units answer any attack on the bot (wild creatures included), and hostile
#   wild creatures near the base and its workers are attacked first. Its units also fight predators on their own
#   (AutoTargetPriority@PREDATORS, rules/defaults.yaml).
# - PwHuntingBotModule: army units near the base hunt (the Hunt toggle): wild creatures around them, then the meat.
# - PwSpellBotModule: casters cast their spells (PwSpell) by what they do: blows, area blows, heals, shields,
#   copies, raising the dead, a teleport home; unarmed casters (Unicorn, ManaSpread) follow the army.
# - PwMergeBotModule: Tyrano units waiting at the base merge (TwinVelocis, Mutant, one TwinRhamphos to see invisible
#   units); the Mutant Morphosis research comes first once the bot has a part.
# - PwDetectorBotModule (Medium): trains detectors (Revolver, DeathEye, Pixie; the Tyrano merge TwinRhamphos) and
#   posts one between the main building and its berries and one at the base's edge; later one goes with each attack.
# Two levels: Easy (the first AI, called Normal before) and Medium (Easy with a second base, a Trap by the berries
# and detectors).
# The stock SquadManagerBotModule attacks and defends; it takes type names, so a new faction adds its workers to
# ExcludeFromSquadsTypes, its main building to ConstructionYardTypes, its air units to AirUnitsTypes and what it
# defends to ProtectionTypes. The weights and limits below only tune them; types not listed use the defaults.
player:
	ModularBot@Easy:
		Name: bot-easy.name
		Type: easy
	ModularBot@Medium:
		Name: bot-medium.name
		Type: medium
	GrantConditionOnBotOwner@easy:
		Condition: enable-easy-ai
		Bots: easy
	GrantConditionOnBotOwner@medium:
		Condition: enable-medium-ai
		Bots: medium

	# ------------------------------------------------------------------ Easy

	PwBaseBuilderBotModule@easy:
		RequiresCondition: enable-easy-ai
		BuildingLimits:
			primitive-powerhouse: 2
			primitive-soldierhouse: 2
			primitive-trap: 2
			tyrano-eggnest: 2
			demon-deathden: 2
			elf-redhall: 2
	PwGathererBotModule@easy:
		RequiresCondition: enable-easy-ai
	PwUnitBuilderBotModule@easy:
		RequiresCondition: enable-easy-ai
		# Tyrano units have no armour of their own: the mutations come first (the races' other research waits for cash).
		PriorityResearch: tyrano-upgrade-ground-dino-mutation-armor, tyrano-upgrade-ground-dinos-mutation-weapon
		UnitWeights:
			primitive-powerman: 20
			primitive-soldier: 20
			primitive-giant: 10
			primitive-knight: 12
			primitive-bowmachine: 8
			primitive-squadron: 6
			primitive-flattop: 4
			primitive-chief: 3
			tyrano-masos: 10
			tyrano-velocis: 24
			tyrano-dilophos: 20
			tyrano-trices: 12
			tyrano-eggthrower: 8
			tyrano-rhamphos: 8
			tyrano-pteras: 10
			tyrano-tyranos: 3
			demon-skeleton: 20
			demon-mudman: 15
			demon-kelpa: 12
			demon-kingdemon: 10
			demon-darkbat: 8
			demon-gargoyle: 6
			demon-devil: 3
			elf-redelf: 20
			elf-whiteelf: 14
			elf-ranger: 15
			elf-blueelf: 12
			elf-phoenix: 6
			elf-dragon: 6
			elf-angelelf: 3
			elf-unicorn: 8
			elf-manaspread: 4
		UnitLimits:
			primitive-chief: 1
			tyrano-tyranos: 1
			demon-devil: 1
			elf-angelelf: 1
	PwTransportBotModule@easy:
		RequiresCondition: enable-easy-ai
	PwAbilityBotModule@easy:
		RequiresCondition: enable-easy-ai
	PwDefenseBotModule@easy:
		RequiresCondition: enable-easy-ai
	PwHuntingBotModule@easy:
		RequiresCondition: enable-easy-ai
	PwSpellBotModule@easy:
		# Elf casters wait before their first spell on meeting an enemy, and between spells.
		CastDelay: 1000
		EngageDelay: 250
		RequiresCondition: enable-easy-ai
		# The Elves' spells for now; the Demons' come later.
		Spells: thunder-bolt, shield, mass-temper, teleport, jump-portal, drop-stone, cure, fake, meteor, resurrect
	PwMergeBotModule@easy:
		RequiresCondition: enable-easy-ai
		Into:
			tyrano-twinvelocis: 0
			tyrano-mutant: 0
			tyrano-twinrhamphos: 1
	SquadManagerBotModule@easy:
		RequiresCondition: enable-easy-ai
		# Twice the engine's ticks: the world runs two ticks per original tick (tickrate-plan.md).
		AssignRolesInterval: 100
		AttackForceInterval: 150
		RushInterval: 1200
		SquadSize: 8
		# Attack waves go for the other players, not wild creatures (PwDefenseBotModule deals with those).
		IgnoredEnemyTargetTypes: Wild
		ExcludeFromSquadsTypes: primitive-buildman, primitive-revolver, tyrano-dinos, tyrano-dsunguri, tyrano-twinrhamphos, demon-insect, demon-phantom, demon-deatheye, elf-wizard, elf-elfring, elf-pixie, elf-unicorn, elf-manaspread
		ConstructionYardTypes: primitive-sanctuary, tyrano-tyranonest, demon-demonden, elf-heaven
		AirUnitsTypes: primitive-squadron, primitive-flattop, tyrano-pteras, tyrano-mutant, demon-darkbat, demon-gargoyle, elf-phoenix, elf-dragon, elf-angelelf
		ProtectionTypes: primitive-sanctuary, primitive-house, primitive-powerhouse, primitive-soldierhouse, primitive-skyhouse, primitive-blacksmith, primitive-landincreaser, primitive-skyincreaser, primitive-stonetower, primitive-buildman, tyrano-tyranonest, tyrano-nest, tyrano-eggnest, tyrano-landnest, tyrano-skynest, tyrano-thrownest, tyrano-upgradenest, tyrano-landnisdos, tyrano-skynisdos, tyrano-ascomoid, tyrano-dinos, demon-demonden, demon-tomb, demon-deathden, demon-flyden, demon-magicden, demon-hell, demon-dirtyportal, demon-highportal, demon-volcano, demon-insect, elf-heaven, elf-elftree, elf-redhall, elf-bluehall, elf-manahall, elf-skyhall, elf-elflibrary, elf-skylibrary, elf-manalibrary, elf-bubble, elf-wizard

	# ------------------------------------------------------------------ Medium: Easy's play with a second base,
	# a Trap by the berries (Primitive) and detectors at home and in the attack waves; a little quicker and bigger.

	PwBaseBuilderBotModule@medium:
		RequiresCondition: enable-medium-ai
		DecisionInterval: 100
		MinimumWorkers: 5
		CashReserve: 150
		PopulationMargin: 4
		# A second main building by other berries after about 8 minutes (71 ms ticks); its towers come from the
		# higher tower limits.
		ExpansionDelay: 13500
		# One Trap by the berry bushes.
		BushDefenses:
			primitive-trap: 1
		BuildingLimits:
			primitive-powerhouse: 2
			primitive-soldierhouse: 2
			primitive-stonetower: 4
			primitive-trap: 2
			tyrano-eggnest: 2
			tyrano-ascomoid: 4
			demon-deathden: 2
			demon-volcano: 4
			elf-redhall: 2
			elf-bubble: 4
	PwGathererBotModule@medium:
		RequiresCondition: enable-medium-ai
	PwUnitBuilderBotModule@medium:
		RequiresCondition: enable-medium-ai
		# More workers for the second base.
		MinimumWorkers: 7
		MaximumWorkers: 16
		ResearchCash: 1250
		# Tyrano units have no armour of their own: the mutations come first (the races' other research waits for cash).
		PriorityResearch: tyrano-upgrade-ground-dino-mutation-armor, tyrano-upgrade-ground-dinos-mutation-weapon
		UnitWeights:
			primitive-powerman: 20
			primitive-soldier: 20
			primitive-giant: 10
			primitive-knight: 12
			primitive-bowmachine: 8
			primitive-squadron: 6
			primitive-flattop: 4
			primitive-chief: 3
			tyrano-masos: 10
			tyrano-velocis: 24
			tyrano-dilophos: 20
			tyrano-trices: 12
			tyrano-eggthrower: 8
			# Rhamphos are trained to merge into detectors (PwDetectorBotModule), not for the army.
			tyrano-rhamphos: 0
			tyrano-pteras: 10
			tyrano-tyranos: 3
			demon-skeleton: 20
			demon-mudman: 15
			demon-kelpa: 12
			demon-kingdemon: 10
			demon-darkbat: 8
			demon-gargoyle: 6
			demon-devil: 3
			elf-redelf: 20
			elf-whiteelf: 14
			elf-ranger: 15
			elf-blueelf: 12
			elf-phoenix: 6
			elf-dragon: 6
			elf-angelelf: 3
			elf-unicorn: 8
			elf-manaspread: 4
		UnitLimits:
			primitive-chief: 1
			tyrano-tyranos: 1
			demon-devil: 1
			elf-angelelf: 1
	PwTransportBotModule@medium:
		RequiresCondition: enable-medium-ai
	PwAbilityBotModule@medium:
		RequiresCondition: enable-medium-ai
	PwDefenseBotModule@medium:
		RequiresCondition: enable-medium-ai
	PwHuntingBotModule@medium:
		RequiresCondition: enable-medium-ai
	# Detectors: one between the main building and its berries, one at the base's edge, and after about 10 minutes one
	# with every attack wave.
	PwDetectorBotModule@medium:
		RequiresCondition: enable-medium-ai
		EscortDelay: 17000
	PwSpellBotModule@medium:
		CastDelay: 500
		EngageDelay: 150
		RequiresCondition: enable-medium-ai
		# The Elves' spells for now; the Demons' come later.
		Spells: thunder-bolt, shield, mass-temper, teleport, jump-portal, drop-stone, cure, fake, meteor, resurrect
	PwMergeBotModule@medium:
		RequiresCondition: enable-medium-ai
		Into:
			tyrano-twinvelocis: 0
			tyrano-mutant: 0
			# The Tyrano detectors (PwDetectorBotModule posts and escorts them).
			tyrano-twinrhamphos: 3
	SquadManagerBotModule@medium:
		RequiresCondition: enable-medium-ai
		# Twice the engine's ticks: the world runs two ticks per original tick (tickrate-plan.md).
		AssignRolesInterval: 100
		AttackForceInterval: 150
		RushInterval: 1200
		SquadSize: 10
		SquadSizeRandomBonus: 3
		# Attack waves go for the other players, not wild creatures (PwDefenseBotModule deals with those).
		IgnoredEnemyTargetTypes: Wild
		ExcludeFromSquadsTypes: primitive-buildman, primitive-revolver, tyrano-dinos, tyrano-dsunguri, tyrano-rhamphos, tyrano-twinrhamphos, demon-insect, demon-phantom, demon-deatheye, elf-wizard, elf-elfring, elf-pixie, elf-unicorn, elf-manaspread
		ConstructionYardTypes: primitive-sanctuary, tyrano-tyranonest, demon-demonden, elf-heaven
		AirUnitsTypes: primitive-squadron, primitive-flattop, tyrano-pteras, tyrano-mutant, demon-darkbat, demon-gargoyle, elf-phoenix, elf-dragon, elf-angelelf
		ProtectionTypes: primitive-sanctuary, primitive-house, primitive-powerhouse, primitive-soldierhouse, primitive-skyhouse, primitive-blacksmith, primitive-landincreaser, primitive-skyincreaser, primitive-stonetower, primitive-buildman, tyrano-tyranonest, tyrano-nest, tyrano-eggnest, tyrano-landnest, tyrano-skynest, tyrano-thrownest, tyrano-upgradenest, tyrano-landnisdos, tyrano-skynisdos, tyrano-ascomoid, tyrano-dinos, demon-demonden, demon-tomb, demon-deathden, demon-flyden, demon-magicden, demon-hell, demon-dirtyportal, demon-highportal, demon-volcano, demon-insect, elf-heaven, elf-elftree, elf-redhall, elf-bluehall, elf-manahall, elf-skyhall, elf-elflibrary, elf-skylibrary, elf-manalibrary, elf-bubble, elf-wizard
