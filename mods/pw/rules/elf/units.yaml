# The ManaSpread flies low ("Fly"), unarmed: it refills the mana of the casters around it (PwManaAura) and, once
# researched, gives itself up for Meteor. It doesn't gain levels.
elf-manaspread:
	Inherits: ^LivingFlyer
	Inherits@flight: ^LowFlight
	Inherits@race: ^Elf
	UsesPopulation:
		Amount: 2
	Buildable:
		Queue: elf-manahall
		BuildDuration: 320
		BuildPaletteOrder: 30
		Prerequisites: elf-manalibrary
	RenderSprites:
		Image: elf-manaspread
	Tooltip:
		Name: actor-elf-manaspread.name
	Valued:
		Cost: 350
	Health:
		HP: 75
	PwArmor:
		Value: 0
	Aircraft:
		Speed: 144
	RevealsShroud:
		Range: 6c0
	PwMana:
		Max: 200
	PwManaAura:
	# Record 9: 60 meteors over the place, each 30 damage within 64 px, falling within 80 px of it; the ManaSpread
	# is gone. After Study Meteor.
	PwSpell@METEOR:
		Name: meteor
		Target: Ground
		Prerequisites: elf-upgrade-meteor-manaspread-1
		Damage: 30
		Steps: 60
		StepInterval: 2
		Delay: 24
		Radius: 2c0
		Scatter: 2c512
		KillsCaster: true
		Image: spell-meteo
		Icon: ability-meteor
		Sound: spell-meteo-0.wav

