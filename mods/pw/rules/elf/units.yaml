# The Unicorn heals (Cure) and, once researched, makes illusions (Fake). It doesn't fight and doesn't gain levels.
elf-unicorn:
	Inherits: ^Infantry
	Inherits@move: ^FootMovement
	Inherits@race: ^Elf
	-Crushable:
	Passenger:
		Weight: 1
	UsesPopulation:
		Amount: 2
	Buildable:
		Queue: elf-manahall
		BuildDuration: 256
		BuildPaletteOrder: 10
	RenderSprites:
		Image: elf-unicorn
	Tooltip:
		Name: actor-elf-unicorn.name
	Valued:
		Cost: 250
	Health:
		HP: 150
	PwArmor:
		Value: 0
	Mobile:
		Speed: 162
	RevealsShroud:
		Range: 9c0
	PwMana:
		Max: 200
	# Record 18: automatically heals the most injured nearby ally, 2 HP for 1 mana each tick.
	PwSpell@CURE:
		Name: cure
		Target: Unit
		TargetRelationships: Ally
		Range: 3c0
		AutoHeal: true
		ManaPerStep: 1
		Heal: 2
		Steps: 1
		Image: spell-cure
		Icon: ability-cure
		Sound: spell-cure-0.wav
	# Record 8: a harmless copy of a unit appears, the Unicorn's own, for 960 ticks; 80 mana, after Study Fake.
	PwSpell@FAKE:
		Name: fake
		Target: Unit
		TargetRelationships: Ally, Enemy, Neutral
		ManaCost: 80
		Prerequisites: elf-upgrade-fake-unicorn-1
		Illusion: true
		Image: spell-fake
		Icon: ability-fake
		Sound: spell-fake-0.wav

