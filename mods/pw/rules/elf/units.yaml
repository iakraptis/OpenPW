# Elf units (docs/game/elf.md). Speeds are the average walk step (px per tick) x 32; ranges, sight and speeds in
# WDist (32 px = 1c0); armour is the original flat value; Passenger weights are .chr 0x188. Casters have mana
# (PwMana, .chr stat 4) and cast PwSpell. A unit's spells are its .chr 0x1f0 bits; each spell's level (record 0x160,
# counted from 0: the help file's from 1), research (0x15c), mana (0x1e4) and effect come from its JW2_11 record, and
# its effect grows with spell power (PwLevels.SpellPower, Level.lvt row 2).

# The worker. It gathers by magic (Berry fly, JW2_11 record 16): it stays at the bush casting, and the berries fly to
# the Heaven on their own.
elf-wizard:
	Inherits: ^Worker
	Inherits@move: ^FootMovement
	Inherits@race: ^Elf
	Inherits@attack: ^Ranged
	Passenger:
		Weight: 1
	PwLevels:
		XpPerLevel: 10
		AttackGain: 18
		ArmorGain: 9
		AttackDelay: 23
	UsesPopulation:
		Amount: 1
	Builder:
		Types: elf-heaven, elf-elftree, elf-redhall, elf-bluehall, elf-manahall, elf-skyhall, elf-elflibrary, elf-manalibrary, elf-skylibrary, elf-bubble
		WorksFromRange: true
		WorkCondition: building
	Buildable:
		Queue: elf-heaven
		BuildDuration: 160
		BuildPaletteOrder: 10
	RenderSprites:
		Image: elf-wizard
	Tooltip:
		Name: actor-elf-wizard.name
	Valued:
		Cost: 100
	Health:
		HP: 90
	PwArmor:
		Value: 0
	Mobile:
		Speed: 144
	RevealsShroud:
		Range: 7c0
	Armament:
		# Strikes on step 9 of its attack animation (.chr 0x247c).
		FireDelay: 9
		Weapon: WizardFirebolt
	BerryGatherer:
		FliesBerries: true
		FlightCondition: berry-flight
	# The Wizard casts at the bush, then keeps casting toward the berry as it flies home.
	WithIdleOverlay@MAGIC:
		Image: spell-berry-fly
		Sequence: cast
		Palette: effect
		RequiresCondition: gathering
	WithIdleOverlay@BUILDING:
		Image: spell-elf-build
		Sequence: cast
		Palette: effect
		RequiresCondition: building
	WithInfantryBody:
		RequiresCondition: !gathering && !carrying && !building
	WithFacingSpriteBody@GATHER:
		Sequence: gather
		RequiresCondition: gathering && !berry-flight
	WithFacingSpriteBody@BUILDING:
		Name: building
		Sequence: attack
		RequiresCondition: building
	WithFacingSpriteBody@BERRYFLIGHT:
		Sequence: gather-flight
		RequiresCondition: berry-flight
	# It never carries (^Worker's carrying body needs art it hasn't got).
	WithInfantryBody@CARRY:
		IdleSequences: stand
		StandSequences: stand
		MoveSequence: walk

