# The Bubble, the Elf defence: bubbles at ground and air in every direction (attack 25, range 288 px, the record's own
# stats). Study Bubble Detection Secret (the Heaven's research) lets it see invisible units.
elf-bubble:
	Inherits: ^Defense
	Inherits@race: ^Elf
	Inherits@conjured: ^ElfBuilding
	UnderConstruction:
		Duration: 960
	Buildable:
		Description: description-elf-bubble
		BuildPaletteOrder: 35
		Prerequisites: elf-elftree
	RenderSprites:
		Image: elf-bubble
	Tooltip:
		Name: actor-elf-bubble.name
	Valued:
		Cost: 300
	Health:
		HP: 350
	PwArmor:
		Value: 0
	Building:
		Footprint: xx
		Dimensions: 2,1
	HitShape:
		TargetableOffsets: 0,0,0
		Type: Rectangle
			TopLeft: -1024, -512
			BottomRight: 1024, 512
	RevealsShroud:
		Range: 10c0
	# Once its detection is researched it sees invisible units over its sight (^Invisible; Pw.exe 0x46832b).
	GrantConditionOnPrerequisite@detection:
		Condition: detection
		Prerequisites: elf-upgrade-bubble-detection-secret-1
	DetectCloaked:
		Range: 10c0
		DetectionTypes: Invisible
		RequiresCondition: !constructing && detection
	Armament:
		# Strikes on step 5 of its attack animation (.chr 0x247c).
		FireDelay: 10
		Weapon: BubbleShot
		RequiresCondition: !constructing
	WithAttackAnimation:
		Sequence: attack
