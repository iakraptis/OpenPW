# Elf buildings (docs/game/elf.md): build time, prerequisites and the units they train from the original tech tree
# (.chr 0x18c, 0x1fc, 0x284). Footprints are the original ones in 32 px cells (.chr 0x330/0x334). They are conjured
# (^ElfBuilding: no construction stages). The ElfTrees provide population as Houses do; the Libraries only
# research.

