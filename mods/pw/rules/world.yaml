^baseworld:
	Inherits: ^palettes
	# Soft-edged shroud and fog (sequences/shroud.yaml).
	# Brings dead wild creatures back after a long while.
	PwRespawner:
	# The units that died lately, for Resurrect (an AngelElf's spell).
	PwGraveyard:
	ShroudRenderer:
		ShroudVariants: shroud
		FogVariants: fog
		OverrideFullShroud: full
		OverrideFullFog: fullfog
		ShroudPalette: greyscale
		FogPalette: greyscale
	ActorMap:
	AlwaysVisible:
	ControlGroups:
	Faction@Random:
		InternalName: Random
		Name: faction-random.name
		RandomFactionMembers: primitive, tyrano, demon, elf
		Description: faction-random.description
	Faction@primitive:
		InternalName: primitive
		Name: faction-primitive.name
		Description: faction-primitive.description
	Faction@tyrano:
		InternalName: tyrano
		Name: faction-tyrano.name
		Description: faction-tyrano.description
	Faction@elf:
		InternalName: elf
		Name: faction-elf.name
		Description: faction-elf.description
	Faction@demon:
		InternalName: demon
		Name: faction-demon.name
		Description: faction-demon.description
	LoadWidgetAtGameStart:
	MusicPlaylist:
	ScreenMap:
	Selection:
	PwTerrainRenderer:
		Tilesets:
			JUNGLE: content|tilesets/jungle.trt
			DUNGEON: content|tilesets/dungeon.trt
			RUIN: content|tilesets/ruin.trt
	# Movement over the terrain types of the converted maps (tilesets/*.yaml): Cliff and Water block ground units.
	Locomotor@FOOT:
		Name: foot
		TerrainSpeeds:
			Clear: 100
			Ramp: 100
	Locomotor@HEAVY:
		Name: heavy
		Crushes: infantry
		TerrainSpeeds:
			Clear: 100
			Ramp: 100
	Locomotor@WATER:
		Name: water
		TerrainSpeeds:
			Water: 100
	Locomotor@WHEELED:
		Name: wheeled
		TerrainSpeeds:
			Clear: 100
			Ramp: 80

world:
	Inherits: ^baseworld
	ColorPickerManager:
		PreviewActor: placeholder.colorpicker
	CreateMapPlayers:
	CustomTerrainDebugOverlay:
	DebugVisualizations:
	MapOptions:
		TechLevelDropdownVisible: false
	MapStartingLocations:
	SpawnMapActors:
	SpawnStartingUnits:
	PathFinder:
	BuildingInfluence:
	# The original start is not in the map data (no player units in OBC); a main building and four workers.
	StartingUnits@Primitive:
		BaseActor: primitive-sanctuary
		SupportActors: primitive-buildman, primitive-buildman, primitive-buildman, primitive-buildman
		Factions: primitive
		ClassName: options-starting-units.unlabeled
	StartingUnits@Tyrano:
		BaseActor: tyrano-tyranonest
		SupportActors: tyrano-dinos, tyrano-dinos, tyrano-dinos, tyrano-dinos
		Factions: tyrano
		ClassName: options-starting-units.unlabeled
	StartingUnits@Elf:
		BaseActor: elf-heaven
		SupportActors: elf-wizard, elf-wizard, elf-wizard, elf-wizard
		Factions: elf
		ClassName: options-starting-units.unlabeled
	StartingUnits@Demon:
		BaseActor: demon-demonden
		SupportActors: demon-insect, demon-insect, demon-insect, demon-insect
		Factions: demon
		ClassName: options-starting-units.unlabeled

editorworld:
	Inherits: ^baseworld
	BuildableTerrainOverlay:
		AllowedTerrainTypes:
		Palette:
	EditorActionManager:
	EditorActorLayer:
	EditorCursorLayer:
	MarkerLayerOverlay:
	TerrainGeometryOverlay:
