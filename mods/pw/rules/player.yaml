^baseplayer:
	AlwaysVisible:
	# Fog of war and an unexplored map, as in the original (both can be changed in the lobby).
	Shroud:
		FogCheckboxEnabled: true
		ExploredMapCheckboxEnabled: false

player:
	Inherits: ^baseplayer
	DeveloperMode:
	FrozenActorLayer:
	# The minimap's terrain as the player has explored it: without it the radar painted no terrain at all (black).
	PlayerRadarTerrain:
	PlayerStatistics:
	TechTree:
	# Conditions on prerequisites and researched upgrades (the StoneTower's detection).
	GrantConditionOnPrerequisiteManager:
	# Researched upgrades (rules/<race>/upgrades.yaml), which also count as prerequisites.
	PwUpgrades:
	# Berries, the one resource (docs/game/rules.md): every player starts with 400 (P_PLAYE 0x144).
	PlayerResources:
		DefaultCash: 400
	MissionObjectives:
		WinNotification: Win
		LoseNotification: Lose
	# Buildings under attack: the race's spoken warning (notifications/pw.yaml).
	BaseAttackNotifier:
	ConquestVictoryConditions:

editorplayer:
	Inherits: ^baseplayer
