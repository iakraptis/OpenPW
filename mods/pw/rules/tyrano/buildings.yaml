# Tyrano buildings (docs/game/tyrano.md): build time, prerequisites and the units they train from the original tech
# tree (.chr 0x18c, 0x1fc, 0x284). Footprints are the original ones in 32 px cells (.chr 0x330/0x334). The Nests
# provide population as Houses do; LandNest, SkyNest and UpgradeNest only research, the Nisdos are only requirements.

tyrano-tyranonest:
	Inherits: ^ProductionBuilding
	Inherits@race: ^Tyrano
	Inherits@exits: ^Exits6x4
	ProvidesPopulation:
		Amount: 9
		RequiresCondition: !constructing
	AcceptsBerries:
	UnderConstruction:
		Duration: 1440
	Buildable:
		Description: description-tyrano-tyranonest
		BuildPaletteOrder: 10
	Production:
		Produces: tyrano-tyranonest
	PwProductionQueue:
		Type: tyrano-tyranonest
	RenderSprites:
		Image: tyrano-tyranonest
	Tooltip:
		Name: actor-tyrano-tyranonest.name
	Valued:
		Cost: 800
	Health:
		HP: 3500
	PwArmor:
		Value: 0
	Building:
		Footprint: xxxxxx xxxxxx xxxxxx xxxxxx
		Dimensions: 6,4
	HitShape:
		TargetableOffsets: 0,0,0
		Type: Rectangle
			TopLeft: -3072, -2048
			BottomRight: 3072, 2048
	RevealsShroud:
		Range: 12c0

