# The Ascomoid, the Tyrano defence: shoots spores at ground and air in every direction (attack 35, range 288 px, the
# record's own stats). It sees invisible units (a detector from the start).
tyrano-ascomoid:
	Inherits: ^Defense
	Inherits@race: ^Tyrano
	UnderConstruction:
		Duration: 560
	Buildable:
		Description: description-tyrano-ascomoid
		BuildPaletteOrder: 35
		Prerequisites: tyrano-eggnest
	RenderSprites:
		Image: tyrano-ascomoid
	Tooltip:
		Name: actor-tyrano-ascomoid.name
	Valued:
		Cost: 400
	Health:
		HP: 400
	PwArmor:
		Value: 0
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	HitShape:
		TargetableOffsets: 0,0,0
		Type: Rectangle
			TopLeft: -1024, -1024
			BottomRight: 1024, 1024
	RevealsShroud:
		Range: 11c0
	# A detector (.chr 0x1f8 bit 0x1): it sees invisible units over its sight (^Invisible).
	DetectCloaked:
		Range: 11c0
		DetectionTypes: Invisible
		RequiresCondition: !constructing
	Armament:
		Weapon: AscomoidShot
		RequiresCondition: !constructing
	WithAttackAnimation:
		Sequence: attack
