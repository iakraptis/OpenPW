	Armament:
		# Strikes on step 8 of its attack animation (.chr 0x247c).
		FireDelay: 8
		Weapon: MutantArrow
	PwMerged:
		From: tyrano-dilophos, tyrano-pteras, tyrano-trices
		Prerequisites: tyrano-upgrade-mutant-morphosis-1
		Image: command-mutate
