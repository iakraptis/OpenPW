# The "Sky Rhamphos" that scouts (help file): unarmed, high, far-sighted, and a detector (.chr 0x1f8 bit 0x1:
# ^Invisible), seeing invisible units over its sight. It doesn't gain levels (.chr 0x1f4).
tyrano-twinrhamphos:
	Inherits: ^LivingFlyer
	Inherits@race: ^Tyrano
	Inherits@disguise: ^DisguisableFlyer
	DetectCloaked:
		Range: 10c0
		DetectionTypes: Invisible
	-Buildable:
	UsesPopulation:
		Amount: 2
	RenderSprites:
		Image: tyrano-twinrhamphos
	Tooltip:
		Name: actor-tyrano-twinrhamphos.name
	Valued:
		Cost: 0
	Health:
		HP: 300
	PwArmor:
		Value: 0
	Aircraft:
		Speed: 256
	RevealsShroud:
		Range: 10c0
	PwMerged:
		From: tyrano-rhamphos, tyrano-rhamphos
	# No attack animation (it has no attack).
	WithInfantryBody@FLIGHT:
		DefaultAttackSequence: walk
	PwWithDisguiseBody@DISGUISE:
		Image: wild-pteranodon
	Tooltip@DISGUISE:
		Name: actor-tyrano-twinrhamphos-disguised.name
		GenericName: actor-wild-pteranodon.name

