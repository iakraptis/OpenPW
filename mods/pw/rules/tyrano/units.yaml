# Made of a Dilophos, a Pteras and a Trices, once Mutant Morphosis is researched; "as powerful as Tyranos".
tyrano-mutant:
	Inherits: ^LivingFlyer
	Inherits@race: ^Tyrano
	Inherits@attack: ^AirAttack
	-Buildable:
	PwLevels:
		XpPerLevel: 30
		AttackGain: 36
		ArmorGain: 36
		AttackDelay: 48
		RangeBonus: 0, 18, 36, 54, 72, 90, 108, 126, 144, 160
