	Tooltip:
		Name: actor-tyrano-mutant.name
	Valued:
		Cost: 0
	# The mod's health (the original's 550): more than its three parts' 730, so merging isn't a loss.
	Health:
		HP: 900
	PwArmor:
		Value: 0
	Aircraft:
		Speed: 184
	RevealsShroud:
