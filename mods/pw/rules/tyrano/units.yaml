	Aircraft:
		Speed: 224
		IdleBehavior: Land
		LandableTerrainTypes: Clear, Ramp
	RevealsShroud:
		Range: 10c0
	Cargo:
		Types: Ground
		MaxWeight: 12
		UnloadVoice: Action
