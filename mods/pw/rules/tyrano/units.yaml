# Tyrano units (docs/game/tyrano.md). Speeds are the average walk step (px per tick) x 32; ranges, sight and speeds
# in WDist (32 px = 1c0); armour is the original flat value; Passenger weights are .chr 0x188. Merged units
# (TwinVelocis, TwinRhamphos, Mutant) are never trained: PwMerge on their parts names them, PwMerged lists the parts.
# Disguise (the Disguise research) is for the units of its upgrade record: Velocis, Dilophos, Rhamphos, TwinRhamphos,
# Pteras, Trices; each turns into the wild creature of its kind.

tyrano-dinos:
	Inherits: ^Worker
	Inherits@move: ^FootMovement
	Inherits@race: ^Tyrano
	Inherits@attack: ^Melee
	Passenger:
		Weight: 1
	PwLevels:
		XpPerLevel: 10
		AttackGain: 18
		ArmorGain: 18
		AttackDelay: 23
	UsesPopulation:
		Amount: 1
	Builder:
		Types: tyrano-tyranonest, tyrano-nest, tyrano-eggnest, tyrano-landnest, tyrano-skynest, tyrano-thrownest, tyrano-upgradenest, tyrano-landnisdos, tyrano-skynisdos, tyrano-ascomoid
	Buildable:
		Queue: tyrano-tyranonest
		BuildDuration: 160
		BuildPaletteOrder: 10
	RenderSprites:
		Image: tyrano-dinos
	Tooltip:
		Name: actor-tyrano-dinos.name
	Valued:
		Cost: 100
	Health:
		HP: 100
	PwArmor:
		Value: 0
	Mobile:
		Speed: 160
	RevealsShroud:
		Range: 7c0
	Armament:
		# Strikes on step 7 of its attack animation (.chr 0x247c).
		FireDelay: 7
		Weapon: DinosHit

