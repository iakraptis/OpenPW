# The Dsunguri carries 12 (.chr 0x188 on a transport), landed to load. It doesn't gain levels.
tyrano-dsunguri:
	Inherits: ^LivingFlyer
	Inherits@race: ^Tyrano
	UsesPopulation:
		Amount: 2
	Buildable:
		Queue: tyrano-thrownest
		BuildDuration: 480
		BuildPaletteOrder: 10
		Prerequisites: tyrano-skynest
	RenderSprites:
		Image: tyrano-dsunguri
	Tooltip:
