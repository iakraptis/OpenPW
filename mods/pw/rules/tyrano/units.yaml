	Buildable:
		Queue: tyrano-eggnest
		BuildDuration: 288
		BuildPaletteOrder: 50
		Prerequisites: tyrano-skynest
	RenderSprites:
		Image: tyrano-rhamphos
	Tooltip:
		Name: actor-tyrano-rhamphos.name
	Valued:
