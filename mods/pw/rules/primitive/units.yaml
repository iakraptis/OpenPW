# Flying machines (docs/game/primitive.md). They don't gain levels (.chr 0x1f4 bit 1 clear).
primitive-revolver:
	Inherits: ^Unit
	Inherits@move: ^AirMovement
	Inherits@race: ^Primitive
	Inherits@morale: ^Morale
	UsesPopulation:
		Amount: 2
	Buildable:
		Description: description-primitive-revolver
		Queue: primitive-blacksmith
		BuildDuration: 960
		BuildPaletteOrder: 50
		Prerequisites: primitive-skyhouse
	RenderSprites:
		Image: primitive-revolver
	Tooltip:
		Name: actor-primitive-revolver.name
	Valued:
		Cost: 400
	Health:
		HP: 300
	Aircraft:
		AltitudeVelocity: 0c22
		Speed: 94
		IdleBehavior: Land
		LandableTerrainTypes: Clear, Ramp
	RevealsShroud:
		Range: 12c0
	# A detector (.chr 0x1f8 bit 0x1): it sees invisible units over its sight (^Invisible).
	DetectCloaked:
		Range: 12c0
		DetectionTypes: Invisible
	# Room for 10 (.chr 0x188 on a transport, deduced), 18 with Improve Revolver Transportation (+8); passengers
	# weigh their transport size. Landed to load.
	Cargo:
		AfterLoadDelay: 16
		BeforeUnloadDelay: 16
		AfterUnloadDelay: 50
		Types: Ground
		MaxWeight: 18
		UnloadVoice: Action
	# Unload at a place (the command panel's Unload button).
	PwUnloadAt:
	PwTransportCapacity:
		Capacity: 10
	WithInfantryBody:
		MinIdleDelay: 60
		MaxIdleDelay: 220
		IdleSequences: stand
		StandSequences: stand
		MoveSequence: walk
		DefaultAttackSequence: stand

