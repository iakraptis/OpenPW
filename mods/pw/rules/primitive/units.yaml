# Primitive units (docs/game/primitive.md). Speeds are the average walk step (px per tick) x 32; ranges, sight
# and speeds in WDist (32 px = 1c0); armour is the original flat value. Equipped forms (Blacksmith items) inherit
# their base unit; the item adds 15 attack (in their weapon) or 7 armour.

primitive-buildman:
	Inherits: ^Worker
	Inherits@move: ^FootMovement
	Inherits@race: ^Primitive
	Inherits@attack: ^Melee
	Inherits@morale: ^Morale
	Passenger:
		Weight: 1
	PwLevels:
		XpPerLevel: 10
		AttackGain: 18
		ArmorGain: 9
		AttackDelay: 38
	UsesPopulation:
		Amount: 1
	Builder:
		Types: primitive-sanctuary, primitive-house, primitive-powerhouse, primitive-soldierhouse, primitive-blacksmith, primitive-landincreaser, primitive-skyhouse, primitive-skyincreaser, primitive-stonetower, primitive-trap
	Buildable:
		Description: description-primitive-buildman
		Queue: primitive-sanctuary
		BuildDuration: 320
		BuildPaletteOrder: 10
	RenderSprites:
		Image: primitive-buildman
	Tooltip:
		Name: actor-primitive-buildman.name
	Valued:
		Cost: 100
	Health:
		HP: 100
	PwArmor:
		Value: 0
	Mobile:
		TurnSpeed: 256
		Locomotor: foot-worker
		Speed: 80
	RevealsShroud:
		Range: 7c0
	Armament:
		# Strikes on step 7 of its attack animation (.chr 0x247c).
		FireDelay: 14
		Weapon: BuildManHit

