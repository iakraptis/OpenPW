# Primitive units (docs/game/primitive.md). Speeds are the average walk step (px per tick) x 32; ranges, sight
# and speeds in WDist (32 px = 1c0); armour is the original flat value. Equipped forms (Blacksmith items) inherit
# their base unit; the item adds 15 attack (in their weapon) or 7 armour.

primitive-buildman:
	Inherits: ^Worker
	Inherits@move: ^FootMovement
	Inherits@race: ^Primitive
	Inherits@attack: ^Melee
	Builder:
		Types: primitive-sanctuary, primitive-house, primitive-powerhouse, primitive-soldierhouse, primitive-blacksmith, primitive-landincreaser, primitive-skyhouse, primitive-skyincreaser
	Buildable:
		Queue: primitive-sanctuary
		BuildDuration: 160
		BuildPaletteOrder: 10
	RenderSprites:
		Image: primitive-buildman
	Tooltip:
		Name: actor-primitive-buildman.name
	Valued:
		Cost: 100
	Health:
		HP: 100
	PwArmor:
		Value: 0
	Mobile:
		Speed: 160
	RevealsShroud:
		Range: 7c0
	Armament:
		Weapon: BuildManHit

