# Primitive buildings (docs/game/primitive.md). Footprints are the original ones in 32 px cells (.chr 0x330/0x334).

primitive-sanctuary:
	Inherits: ^ProductionBuilding
	Inherits@race: ^Primitive
	RenderSprites:
		Image: primitive-sanctuary
	Tooltip:
		Name: actor-primitive-sanctuary.name
	Valued:
		Cost: 1000
	Health:
		HP: 4000
	PwArmor:
		Value: 0
	Building:
		Footprint: xxxxxx xxxxxx xxxxxx xxxxxx
		Dimensions: 6,4
	HitShape:
		TargetableOffsets: 0,0,0
		Type: Rectangle
			TopLeft: -3072, -2048
			BottomRight: 3072, 2048
	RevealsShroud:
		Range: 12c0

