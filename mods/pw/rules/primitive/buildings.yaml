# Defences. They attack in every direction (AttackOmni) whatever is in range.
primitive-stonetower:
	Inherits: ^Building
	Inherits@race: ^Primitive
	UnderConstruction:
		Duration: 560
	Buildable:
		BuildPaletteOrder: 35
		Prerequisites: primitive-powerhouse
	RenderSprites:
		Image: primitive-stonetower
	Tooltip:
		Name: actor-primitive-stonetower.name
	Valued:
		Cost: 400
	Health:
		HP: 400
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	HitShape:
		TargetableOffsets: 0,0,0
		Type: Rectangle
			TopLeft: -1024, -1024
			BottomRight: 1024, 1024
	RevealsShroud:
		Range: 11c0
	Armament:
		Weapon: Stone
		RequiresCondition: !constructing
	AttackOmni:
		RequiresCondition: !constructing
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, Air
		InvalidTargets: Wild
	# An AI player's towers and traps also strike hostile wild creatures (rules/defaults.yaml ^Melee).
	GrantConditionOnBotOwner@predators:
		Condition: bot-owned
		Bots: normal, hard
	AutoTargetPriority@PREDATORS:
		ValidTargets: Predator
		RequiresCondition: bot-owned
	WithAttackAnimation:
		Sequence: attack

