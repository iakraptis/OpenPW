# The Warlock hovers (.chr 0x17c = 2, ^HoveringFiend): over ground and water, not over cliffs; ground weapons reach
# it. It has no weapon, only its spells: Noxious gas and Suicide from the start, Quake from level 1 (the help file's
# levels 1 and 2).
demon-warlock:
	Inherits: ^HoveringFiend
	Inherits@race: ^Demon
	PwLevels:
		XpPerLevel: 18
		SpellPower: 0, 0, 10, 20, 30, 40, 50, 60, 70, 80
	UsesPopulation:
		Amount: 3
	Buildable:
		Description: description-demon-warlock
		Queue: demon-magicden
		BuildDuration: 480
		BuildPaletteOrder: 20
		Prerequisites: demon-highportal
	RenderSprites:
		Image: demon-warlock
	Tooltip:
		Name: actor-demon-warlock.name
	Valued:
		Cost: 650
	Health:
		HP: 200
	PwArmor:
		Value: 0
	Mobile:
		Speed: 168
	RevealsShroud:
		Range: 7c0
	# Record 13: a poisonous cloud, 3 damage to every living thing within 112 px every tick (all its frames hit,
	# one per tick) for 144 ticks (0x1f4, 0x47937e), the cloud looping meanwhile; 120 kill points.
	PwSpell@NOXIOUS-GAS:
		Name: noxious-gas
		Target: Ground
		Cost: 120
		Damage: 3
		Steps: 144
		EffectTicks: 144
		Radius: 3c512
		LivingOnly: true
		AffectsRelationships: Ally, Enemy, Neutral
		Image: spell-noxious-gas
		Icon: ability-noxious-gas
		Sound: spell-noxious-gas-0.wav
	# Record 12: 150 damage to the enemies within 160 px, and the Warlock dies.
	PwSpell@SUICIDE:
		Name: suicide
		Target: Self
		Damage: 150
		Radius: 5c0
		KillsCaster: true
		Image: spell-suicide
		Icon: ability-suicide
		Sound: spell-suicide-0.wav
	# Record 14: the ground shakes, 12 damage to the enemies within 144 px (buildings too) on its frames 0-24 (0x8bc),
	# one per tick; 150 kill points.
	PwSpell@QUAKE:
		Name: quake
		Target: Ground
		Cost: 150
		MinLevel: 1
		Damage: 12
		Steps: 25
		Radius: 4c512
		Image: spell-quake
		Icon: ability-quake
		Sound: spell-quake-0.wav
