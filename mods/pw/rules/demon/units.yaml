		Image: demon-phantom
	Tooltip:
		Name: actor-demon-phantom.name
	Valued:
		Cost: 400
	Health:
		HP: 300
	PwArmor:
		Value: 0
	Aircraft:
		Speed: 208
		IdleBehavior: Land
		LandableTerrainTypes: Clear, Ramp
	RevealsShroud:
		Range: 11c0
	Cargo:
		Types: Ground
		MaxWeight: 12
		UnloadVoice: Action
	# Unload at a place (the command panel's Unload button).
	PwUnloadAt:
	WithInfantryBody@FLIGHT:
		DefaultAttackSequence: walk

