# Raised by the Devil's Rise death, never trained. Undead: their deaths feed no kill points (.chr 0x1f4 bit 0x10
# clear), they don't level and take no population. They stay until killed: the original times only the Fake spell's
# illusions (unit flag 0x10, set at Pw.exe 0x4792c2), not the raised dead.
^Zombie:
	Inherits: ^Fiend
	Inherits@move: ^FootMovement
	Inherits@race: ^Demon
	Inherits@attack: ^Melee
	-Buildable:
	-PwLiving:
	-PwMeatEater:
	Passenger:
		Weight: 1
	Tooltip:
		Name: actor-demon-risezombie.name
	Valued:
		Cost: 0
	Health:
		HP: 99
	PwArmor:
		Value: 5
	RevealsShroud:
		Range: 8c0
	Armament:
		# Strikes on step 4 of its attack animation (.chr 0x247c).
		FireDelay: 4
		Weapon: ZombieHit

demon-risezombie1:
	Inherits: ^Zombie
	RenderSprites:
		Image: demon-risezombie1
	Mobile:
		Speed: 128

demon-risezombie2:
	Inherits: ^Zombie
	RenderSprites:
		Image: demon-risezombie2
	Mobile:
		Speed: 160

# Flyers. The DeathEye scouts: unarmed, invisible and a detector (.chr 0x1f8 0x3: ^Invisible), seeing invisible units
# over its sight, which Learn DeathEye Sight widens by 128 px. It doesn't gain levels.
demon-deatheye:
	Inherits: ^FlyingFiend
	Inherits@race: ^Demon
	Inherits@stealth: ^Invisible
	DetectCloaked:
		Range: 10c0
		DetectionTypes: Invisible
		RequiresCondition: !sight
	GrantConditionOnPrerequisite@sight:
		Condition: sight
		Prerequisites: demon-upgrade-deatheye-sight-1
	DetectCloaked@SIGHT:
		Range: 14c0
		DetectionTypes: Invisible
		RequiresCondition: sight
	UsesPopulation:
		Amount: 1
	Buildable:
		Description: description-demon-deatheye
		Queue: demon-flyden
		BuildDuration: 560
		BuildPaletteOrder: 10
	RenderSprites:
		Image: demon-deatheye
	Tooltip:
		Name: actor-demon-deatheye.name
	Valued:
		Cost: 300
	Health:
		HP: 100
	PwArmor:
		Value: 0
	Aircraft:
		Speed: 176
	RevealsShroud:
		Range: 10c0
	# No attack animation (it has no attack).
	WithInfantryBody@FLIGHT:
		DefaultAttackSequence: walk

