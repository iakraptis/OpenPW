# Demon units (docs/game/demon.md). Speeds are the average walk step (px per tick) x 32; ranges, sight and speeds in
# WDist (32 px = 1c0); armour is the original flat value; Passenger weights are .chr 0x188. Their health is their kill
# points (^Fiend, PwKillPoints). Spells (PwSpell; JW2_11 records, docs/game/rules.md) cost kill points and grow with
# the caster's level (PwLevels.SpellPower, Level.lvt row 2); the help file's spell levels count from 1, ours from 0.

# The worker. It hovers (.chr 0x17c = 2): over ground and water, not over cliffs; ground weapons reach it, Traps don't.
demon-insect:
	Inherits: ^Worker
	Inherits@move: ^HoverMovement
	Inherits@hover: ^Hovering
	Inherits@race: ^Demon
	Inherits@attack: ^Melee
	PwKillPoints:
	Passenger:
		Weight: 1
	PwLevels:
		XpPerLevel: 10
		AttackGain: 18
		ArmorGain: 11
		AttackDelay: 12
	UsesPopulation:
		Amount: 1
	# It builds but can't repair: the original's Insect isn't ordered onto damaged buildings.
	Builder:
		Types: demon-demonden, demon-tomb, demon-deathden, demon-flyden, demon-magicden, demon-hell, demon-dirtyportal, demon-highportal, demon-volcano
		Repairs: false
	Buildable:
		Description: description-demon-insect
		Queue: demon-demonden
		BuildDuration: 160
		BuildPaletteOrder: 10
	RenderSprites:
		Image: demon-insect
	Tooltip:
		Name: actor-demon-insect.name
	Valued:
		Cost: 100
	Health:
		HP: 90
	PwArmor:
		Value: 0
	Mobile:
		Locomotor: hover-worker
		Speed: 160
	RevealsShroud:
		Range: 8c0
	Armament:
		# Strikes on step 4 of its attack animation (.chr 0x247c).
		FireDelay: 4
		Weapon: InsectHit

