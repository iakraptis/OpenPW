# Demon buildings (docs/game/demon.md): build time, prerequisites and the units they train from the original tech
# tree (.chr 0x18c, 0x1fc, 0x284). Footprints are the original ones in 32 px cells (.chr 0x330/0x334). The Tombs
# provide population as Houses do; the DirtyPortal and HighPortal only research.

demon-demonden:
	Inherits: ^ProductionBuilding
	Inherits@race: ^Demon
	Inherits@exits: ^Exits6x4
	ProvidesPopulation:
		Amount: 9
		RequiresCondition: !constructing
	AcceptsBerries:
	UnderConstruction:
		Duration: 1440
	Buildable:
		BuildPaletteOrder: 10
	Production:
		Produces: demon-demonden
	PwProductionQueue:
		Type: demon-demonden
	RenderSprites:
		Image: demon-demonden
	Tooltip:
		Name: actor-demon-demonden.name
	Valued:
		Cost: 1000
	Health:
		HP: 4500
	PwArmor:
		Value: 0
	Building:
		Footprint: xxxxxx xxxxxx xxxxxx xxxxxx
		Dimensions: 6,4
	HitShape:
		TargetableOffsets: 0,0,0
		Type: Rectangle
			TopLeft: -3072, -2048
			BottomRight: 3072, 2048
	RevealsShroud:
		Range: 12c0

