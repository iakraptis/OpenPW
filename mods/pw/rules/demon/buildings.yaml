# The Volcano, the Demon defence: lava at ground and air in every direction (attack 40, range 288 px, the record's own
# stats). Learn Volcano Detection (the DemonDen's research) lets it see invisible units.
demon-volcano:
	Inherits: ^Defense
	Inherits@race: ^Demon
	UnderConstruction:
		Duration: 560
	Buildable:
		BuildPaletteOrder: 35
		Prerequisites: demon-deathden
	RenderSprites:
		Image: demon-volcano
	Tooltip:
		Name: actor-demon-volcano.name
	Valued:
		Cost: 400
	Health:
		HP: 500
	PwArmor:
		Value: 0
	Building:
		Footprint: xx
		Dimensions: 2,1
	HitShape:
		TargetableOffsets: 0,0,0
		Type: Rectangle
			TopLeft: -1024, -512
			BottomRight: 1024, 512
	RevealsShroud:
		Range: 11c0
	# Once its detection is researched it sees invisible units over its sight (^Invisible; Pw.exe 0x46832b).
	GrantConditionOnPrerequisite@detection:
		Condition: detection
		Prerequisites: demon-upgrade-volcano-detection-1
	DetectCloaked:
		Range: 11c0
		DetectionTypes: Invisible
		RequiresCondition: !constructing && detection
	Armament:
		# Strikes on step 4 of its attack animation (.chr 0x247c).
		FireDelay: 4
		Weapon: VolcanoShot
		RequiresCondition: !constructing
	WithAttackAnimation:
		Sequence: attack
