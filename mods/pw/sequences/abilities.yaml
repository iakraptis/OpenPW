# Ability and command buttons (chrome/magic-<race>.png: JW2_02 Magic.trt; chrome/actions-<race>.png: Action.trt;
# written by the installer's chrome stage).
ability-fall-out:
	icon:
		Filename: chrome/magic-primitive.png
		Start: 0

# The Hunt toggle: the original's hunting button (Action.trt 13, crossed spear and pitchfork).
command-hunt:
	icon:
		Filename: chrome/actions-primitive.png
		Start: 13

# Share meat: the original's meat-sharing button (Action.trt 35, a piece of meat with arrows outward).
command-share-meat:
	icon:
		Filename: chrome/actions-primitive.png
		Start: 35

# The same buttons in the other races' frame styles (CommandPanelLogic picks <image>-<race> for the local player).
command-hunt-tyrano:
	icon:
		Filename: chrome/actions-tyrano.png
		Start: 13

command-share-meat-tyrano:
	icon:
		Filename: chrome/actions-tyrano.png
		Start: 35

command-hunt-elf:
	icon:
		Filename: chrome/actions-elf.png
		Start: 13

command-share-meat-elf:
	icon:
		Filename: chrome/actions-elf.png
		Start: 35

command-hunt-demon:
	icon:
		Filename: chrome/actions-demon.png
		Start: 13

command-share-meat-demon:
	icon:
		Filename: chrome/actions-demon.png
		Start: 35

# Tyrano commands (Action.trt; which icon is which is read from the art): combine (10, arrows inward), mutate (27, the
