# Movement only: PwTerrainRenderer draws the original terrain from the map's terrain.bin (docs/formats/map.md). The
# map converter picks the template from the original cell flags: walkable and buildable, walkable only (ramps),
# water, or blocked (cliffs).
Terrain:
	TerrainType@Clear:
		Type: Clear
		TargetTypes: Ground
		Color: 6B6250
	TerrainType@Ramp:
		Type: Ramp
		TargetTypes: Ground
		Color: 7A6A50
	TerrainType@Water:
		Type: Water
		TargetTypes: Water
		Color: C8501E
	TerrainType@Cliff:
		Type: Cliff
		TargetTypes: Ground
		Color: 3C3630

