# The in-game interface on the race's bottom bar (InterfaceBarLogic, InterfaceBarWidget). The bar is drawn at a scale
# that fits the window; InterfaceBarLogic places everything below on it every tick, so the positions and sizes here
# are only starting values.
Container@PLAYER_WIDGETS:
	Logic: MenuButtonsChromeLogic, InterfaceBarLogic, PwEndScreenLogic, LoadIngameChatLogic
	Children:
		LogicTicker@SIDEBAR_TICKER:
		InterfaceBar@INTERFACE_BAR:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
		# Chat and mission messages (the campaign's transmissions): the engine's CHAT_PANEL, which InterfaceBarLogic
		# moves up so that it sits just above the bar.
		Container@CHAT_ROOT:
		# The berries and population, at the top right: the original resource icons (Food, House) and the numbers.
		# InterfaceBarLogic sizes the icons with the bar.
		StretchedImage@CASH_ICON:
			Width: 16
			Height: 16
			ImageCollection: resource-icons
			ImageName: food
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: SIMPLE_TOOLTIP
		LabelWithTooltip@CASH:
			Width: 120
			Height: 20
			Font: Bold
			Contrast: true
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: SIMPLE_TOOLTIP
		StretchedImage@POPULATION_ICON:
			Width: 16
			Height: 16
			ImageCollection: resource-icons
			ImageName: house
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: SIMPLE_TOOLTIP
		LabelWithTooltip@POPULATION:
			Width: 120
			Height: 20
			Font: Bold
			Contrast: true
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: SIMPLE_TOOLTIP
		# The minimap, in the bar's hole.
		Radar@RADAR:
			Width: 118
			Height: 127
			WorldInteractionController: INTERACTION_CONTROLLER
		# The exposed enemies' markers over the minimap (PwExposure); it draws where the radar draws the map.
		ExposureRadar@EXPOSURE_RADAR:
			Radar: RADAR
		# The players without a main building and their time left (PwExposure), at the top left; InterfaceBarLogic
		# sizes it to its rows and hides it when there are none.
		ColorBlock@NO_HQ_PANEL:
			Width: 200
			Height: 40
			Color: A07A45
			Children:
				ColorBlock@BACK:
					X: 1
					Y: 1
					Color: 24180DE0
				Label@TITLE:
					Height: 18
					Font: Bold
					TextColor: FFFFFF
					VAlign: Top
				# One per player, cloned by InterfaceBarLogic and coloured by relationship.
				Label@ROW:
					Height: 16
					Font: Regular
		MenuButton@OPTIONS_BUTTON:
			IgnoreChildMouseOver: true
			Key: escape
			Width: 40
			Height: 32
			Background:
			TooltipText: button-bar-menu
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: BUTTON_TOOLTIP
			Children:
				StretchedImage@ART:
					Width: 40
					Height: 32
		Button@ALLIES_BUTTON:
			IgnoreChildMouseOver: true
			Width: 40
			Height: 32
			Background:
			TooltipText: button-bar-allies
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: BUTTON_TOOLTIP
			Children:
				StretchedImage@ART:
					Width: 40
					Height: 32
		Button@MSG_BUTTON:
			IgnoreChildMouseOver: true
			Width: 40
			Height: 32
			Background:
			TooltipText: button-bar-msg
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: BUTTON_TOOLTIP
			Children:
				StretchedImage@ART:
					Width: 40
					Height: 32
