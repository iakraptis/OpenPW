# The in-game interface on the race's bottom bar (InterfaceBarLogic, InterfaceBarWidget). The bar is drawn at a scale
# that fits the window; InterfaceBarLogic places everything below on it every tick, so the positions and sizes here
# are only starting values.
Container@PLAYER_WIDGETS:
	Logic: MenuButtonsChromeLogic, InterfaceBarLogic
	Children:
		LogicTicker@SIDEBAR_TICKER:
		InterfaceBar@INTERFACE_BAR:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
		LabelWithTooltip@CASH:
			X: WINDOW_WIDTH - 210
			Y: 8
			Width: 200
			Height: 20
			Align: Right
			Font: Bold
			Contrast: true
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: SIMPLE_TOOLTIP
		LabelWithTooltip@POPULATION:
			X: WINDOW_WIDTH - 210
			Y: 28
			Width: 200
			Height: 20
			Align: Right
			Font: Bold
			Contrast: true
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: SIMPLE_TOOLTIP
		# The minimap, in the bar's hole.
		Radar@RADAR:
			Width: 118
			Height: 127
			WorldInteractionController: INTERACTION_CONTROLLER
