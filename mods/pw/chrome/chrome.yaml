# The races' interface bars (chrome/bar-<race>.png, written by the installer from JW2_02 Intfbg.spr), drawn by
# InterfaceBarWidget on the window's bottom edge: the pieces, at the art's own height (Primitive 161, Elf 164,
# Tyrano 179, Demon 148; the middle is kept whole, one section of each lower panel repeats to fill the width; the
# repeated sections are the ones whose ends join seamlessly), and areas that are not drawn but place the other
# widgets (minimap hole, panels, buttons) or say where the bar is solid (solid-sides, solid-middle: from their top
# edge down, the bar takes the clicks). The pieces are in the art's own pixels; the areas are in an 800 x 161 frame
# whose bottom is the bar's bottom (a race's own y + 161 - its height), the extra height of the taller bars being
# decoration above. Every race's art has its hole and panels at about the same place from the bottom, so all share
# one minimap area (the square inside every race's hole) and the same panels; the buttons and solid edges are each
# race's own.
^bar:
	Regions:
		center: 213, 0, 352, 161
		hole: 331, 38, 112, 112
		left-panel: 16, 70, 294, 80
		right-panel: 462, 70, 322, 80

