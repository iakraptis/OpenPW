Metadata:
	Title: mod-title
	Version: {DEV_VERSION}
	WindowTitle: mod-windowtitle

# The converted Primitive Wars content (tilesets, art, sounds, maps) lives in the player's support folder; it is never
# committed. The asset installer (OpenRA.Mods.Pw/AssetInstaller) writes it from an original installation: on first
# launch the game finds it missing and opens the pw-content mod (PwContentLogic), which converts the player's copy;
# developers can run install-assets.cmd instead.
FileSystem: ContentInstallerFileSystem
	SystemPackages:
		^EngineDir
		$pw: pw
		^EngineDir|mods/common: common
		~^SupportDir|Content/pw/: content
	ContentPackages:
		# Sounds (weapons, voices) are referred to by file name.
		content|sounds
		# The music (music/pw.yaml) likewise.
		content|music
	RequiredContentFiles:
		# Written last by the installer: present only once a conversion has finished.
		content|install-manifest.txt
	ContentInstallerMod: pw-content

MapFolders:
	pw|maps: System
	~content|maps: System

Assemblies: OpenRA.Mods.Common.dll, OpenRA.Mods.Pw.dll

AssetBrowser:
	AudioExtensions: .wav, .mp3
	SpriteExtensions: .png
	VideoExtensions:

SupportsMapsFrom: Pw

LoadScreen: BlankLoadScreen

ServerTraits:
	LobbyCommands
	SkirmishLogic
	PlayerPinger
	MasterServerPinger

MapGrid:
	Type: Rectangular

SpriteFormats: PngSheet

SoundFormats: Wav, Mp3

TerrainFormat: DefaultTerrain

SpriteSequenceFormat: DefaultSpriteSequence

DefaultOrderGenerator: UnitOrderGenerator

# Primitive Wars runs its game logic in ticks of these lengths (Pw.exe 0x563ac4, docs/game/rules.md); the default
# is 71 ms. All durations and speeds in the rules are original ticks, so they need no rescaling.
# OrderLatency: in a multiplayer game an order is carried out this many network frames after it is given, so that every
# player runs it on the same tick; a skirmish keeps 3 ticks (engine fork). NetFrameInterval: ticks per network frame (engine fork,
# GameSpeed.NetFrameInterval; the engine's default is 3). PW's ticks are long (the original's 71 ms), so a frame is one
# tick (an order waits at most one tick to be sent) and OrderLatency gives about 0.4 s at each speed, as the engine's
# own mods have (RA: 0.36-0.48 s): Timestep x OrderLatency. Fewer would feel quicker but stall more on a slow line.
GameSpeeds:
	DefaultSpeed: default
	Speeds:
		fastest:
			Name: options-game-speed.fastest
			Timestep: 45
			OrderLatency: 9
			NetFrameInterval: 1
		faster:
			Name: options-game-speed.faster
			Timestep: 55
			OrderLatency: 7
			NetFrameInterval: 1
		fast:
			Name: options-game-speed.fast
			Timestep: 62
			OrderLatency: 6
			NetFrameInterval: 1
		default:
			Name: options-game-speed.normal
			Timestep: 71
			OrderLatency: 6
			NetFrameInterval: 1
		slower:
			Name: options-game-speed.slower
			Timestep: 100
			OrderLatency: 4
			NetFrameInterval: 1
		slowest:
			Name: options-game-speed.slowest
			Timestep: 142
			OrderLatency: 3
			NetFrameInterval: 1
		# The automated test maps only (5x normal): selected by their map options.
		test:
			Name: options-game-speed-test
			Timestep: 14
			OrderLatency: 3
			NetFrameInterval: 1

Include: mod.content.yaml
Include: mod.chrome.yaml
