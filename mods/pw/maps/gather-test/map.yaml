MapFormat: 12

RequiresMod: pw

Title: Test: Gathering rate

Author: OpenPW

Tileset: TEST

MapSize: 88,88

Bounds: 1,1,86,86

Visibility: MissionSelector

Categories: Test

# Four bases, one per race. Nobody is anyone's enemy.
Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: Random
	PlayerReference@Multi0:
		Name: Multi0
		Playable: True
		LockFaction: True
		NonCombatant: True
		Faction: primitive
	PlayerReference@Primitive:
		Name: Primitive
		Faction: primitive
	PlayerReference@Tyrano:
		Name: Tyrano
		Faction: tyrano
	PlayerReference@Elf:
		Name: Elf
		Faction: elf
	PlayerReference@Demon:
		Name: Demon
		Faction: demon

Actors:
	Spawn0: mpspawn
		Owner: Neutral
		Location: 2,2

Rules:
	player:
		# Fog off and the map explored: the test measures gathering, not visibility.
		Shroud:
			FogCheckboxEnabled: False
			FogCheckboxLocked: True
			ExploredMapCheckboxEnabled: True
			ExploredMapCheckboxLocked: True
		-ConquestVictoryConditions:
	world:
		-SpawnStartingUnits:
		LuaScript:
			Scripts: testlib.lua, test.lua
		# 5x speed: the test runs in about a minute.
		MapOptions:
			GameSpeed: test
			GameSpeedDropdownLocked: true
