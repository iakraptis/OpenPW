MapFormat: 12

RequiresMod: pw

Title: Test: Combat

Author: OpenPW

Tileset: TEST

MapSize: 88,88

Bounds: 1,1,86,86

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: Random
	PlayerReference@Creeps:
		Name: Creeps
		NonCombatant: True
		Faction: Random
		Enemies: Combat, Defence, Levels
	PlayerReference@Multi0:
		Name: Multi0
		Playable: True
		LockFaction: True
		NonCombatant: True
		Faction: primitive
	PlayerReference@Combat:
		Name: Combat
		LockFaction: True
		Faction: primitive
		Enemies: Creeps
	PlayerReference@Defence:
		Name: Defence
		LockFaction: True
		Faction: primitive
		Enemies: Creeps
	PlayerReference@Levels:
		Name: Levels
		LockFaction: True
		Faction: primitive
		Enemies: Creeps

Actors:
	Spawn0: mpspawn
		Owner: Neutral
		Location: 2,2

Rules:
	player:
		# Fog off and the map explored: the tests check rules, not visibility.
		Shroud:
			FogCheckboxEnabled: False
			FogCheckboxLocked: True
			ExploredMapCheckboxEnabled: True
			ExploredMapCheckboxLocked: True
		# Scripted actors appear after the first victory check.
		-ConquestVictoryConditions:
	world:
		-SpawnStartingUnits:
		LuaScript:
			Scripts: testlib.lua, test.lua
		# 5x speed: the test runs in a few seconds.
		MapOptions:
			GameSpeed: test
			GameSpeedDropdownLocked: true
