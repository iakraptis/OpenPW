MapFormat: 12

RequiresMod: pw

Title: Test: Tyrano

Author: OpenPW

Tileset: TEST

MapSize: 34,34

Bounds: 1,1,32,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: Random
	PlayerReference@Creeps:
		Name: Creeps
		NonCombatant: True
		Faction: Random
		Enemies: Multi0, Enemy
	PlayerReference@Multi0:
		Name: Multi0
		Playable: True
		LockFaction: True
		Faction: tyrano
		Enemies: Creeps, Enemy
	PlayerReference@Enemy:
		Name: Enemy
		Faction: primitive
		Enemies: Creeps, Multi0

Actors:
	Spawn0: mpspawn
		Owner: Multi0
		Location: 28,28

Rules:
	player:
		# Fog off and the map explored: the tests check rules, not visibility.
		Shroud:
			FogCheckboxEnabled: False
			FogCheckboxLocked: True
			ExploredMapCheckboxEnabled: True
			ExploredMapCheckboxLocked: True
		# Scripted actors appear after the first victory check.
		-ConquestVictoryConditions:
	world:
		-SpawnStartingUnits:
		LuaScript:
			Scripts: testlib.lua, test.lua
		# 5x speed: the test runs in a few seconds.
		MapOptions:
			GameSpeed: test
			GameSpeedDropdownLocked: true
