	RaiderDen: demon-demonden
		Owner: Raider
		Location: 10,20
	RaiderInsect0: demon-insect
		Owner: Raider
		Location: 16,24
	RaiderInsect1: demon-insect
		Owner: Raider
		Location: 17,24
	KeptSkeleton: demon-skeleton
		Owner: Raider
