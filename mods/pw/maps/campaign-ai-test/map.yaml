Rules: pw|rules/campaign-ai.yaml
	player:
		# Fog off and the map explored: the tests check rules, not visibility.
		Shroud:
			FogCheckboxEnabled: False
			FogCheckboxLocked: True
			ExploredMapCheckboxEnabled: True
			ExploredMapCheckboxLocked: True
		-ConquestVictoryConditions:
		# As a mission's rules (AssetInstaller/Campaign.cs): Raider wants 3 Skeletons and has no Death Den, attacks at 3
		# (the strength shares off), and keeps KeptSkeleton out of it; Passive's script is UNUSE_SCRIPT.
		PwCampaignBotModule@campaign:
			Train:
				Raider:
					demon-skeleton: 4
				Passive:
					demon-skeleton: 3
			Settings:
				Raider:
					ATTACK_COUNTER: 3
					ATTACK_WINABLE: 0
					ATTACK_BACK: 0
					ATTACK_MOVE: 50
					HUNT: 0
				Passive:
					PASSIVE: 1
			Kept:
				Raider: KeptSkeleton
	world:
		-SpawnStartingUnits:
		LuaScript:
			Scripts: testlib.lua, test.lua
		# 5x speed: the test runs in a few seconds.
		MapOptions:
			GameSpeed: test
			GameSpeedDropdownLocked: true
