MapFormat: 12

RequiresMod: pw

Title: Test: Bot hunting

Author: OpenPW

Tileset: TEST

MapSize: 34,34

Bounds: 1,1,32,32

Visibility: MissionSelector

Categories: Test

Players:
	PlayerReference@Neutral:
		Name: Neutral
		OwnsWorld: True
		NonCombatant: True
		Faction: Random
	PlayerReference@Creeps:
		Name: Creeps
		NonCombatant: True
		Faction: Random
		Enemies: Raider, Target
	PlayerReference@Multi0:
		Name: Multi0
		Playable: True
		LockFaction: True
		NonCombatant: True
		Faction: primitive
	PlayerReference@Raider:
		Name: Raider
		Bot: normal
		Faction: primitive
		LockFaction: True
		Enemies: Target, Creeps
	PlayerReference@Target:
		Name: Target
		Faction: primitive
		LockFaction: True
		Enemies: Raider, Creeps

Actors:
	Spawn: mpspawn
		Owner: Neutral
		Location: 16,30
	RaiderSanctuary: primitive-sanctuary
		Owner: Raider
		Location: 2,2
	Knight0: primitive-knight
		Owner: Raider
		Location: 9,10
	Knight1: primitive-knight
		Owner: Raider
		Location: 10,10
	Grazer: wild-galimimus
		Owner: Creeps
		Location: 14,11
	FarGrazer: wild-galimimus
		Owner: Creeps
		Location: 28,28

Rules:
	player:
		# Fog off and the map explored: the tests check rules, not visibility.
		Shroud:
			FogCheckboxEnabled: False
			FogCheckboxLocked: True
			ExploredMapCheckboxEnabled: True
			ExploredMapCheckboxLocked: True
		# Scripted actors appear after the first victory check.
		-ConquestVictoryConditions:
	world:
		-SpawnStartingUnits:
		LuaScript:
			Scripts: testlib.lua, test.lua
		# 5x speed: the test runs in a few seconds.
		MapOptions:
			GameSpeed: test
			GameSpeedDropdownLocked: true
